<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E46「迷雾之战 · 雾中三脚巨影」原型</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#14161a; color:#cfd3da; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
  #app { display:flex; gap:12px; padding:12px; align-items:flex-start; }
  #panel { width:300px; flex:0 0 300px; background:#1b1e24; border:1px solid #2a2f38; border-radius:6px; padding:10px; max-height:96vh; overflow:auto; }
  #panel h3 { margin:14px 0 6px; font-size:11px; letter-spacing:.08em; color:#8f98a6; text-transform:uppercase; }
  #panel h3:first-child { margin-top:0; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row label { flex:1 1 auto; color:#a7aeb9; }
  .row input[type=range] { flex:0 0 116px; }
  .row output { flex:0 0 48px; text-align:right; color:#e3e7ee; }
  .row select { flex:0 0 76px; background:#262c36; color:#cfd3da; border:1px solid #333b47; border-radius:4px; }
  #stage { position:relative; }
  canvas { display:block; background:#000; border:1px solid #2a2f38; border-radius:4px; }
  #hud { position:absolute; left:8px; top:8px; background:rgba(10,12,15,.62); padding:6px 9px; border-radius:4px;
         font-size:11px; white-space:pre; pointer-events:none; color:#dfe4ec; }
  .btns { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  button { background:#262c36; color:#cfd3da; border:1px solid #333b47; border-radius:4px; padding:3px 7px; font:inherit; cursor:pointer; }
  button:hover { background:#323a47; }
  #log { margin-top:8px; font-size:11px; white-space:pre-wrap; word-break:break-all; max-height:250px; overflow:auto; }
  .ok { color:#7fd08a; } .bad { color:#ff7b72; } .warn { color:#e3b341; }
  .ph { display:flex; gap:3px; flex-wrap:wrap; margin-top:6px; }
  .ph b { font-weight:400; padding:2px 5px; border-radius:3px; background:#22262e; color:#8f98a6; cursor:pointer; }
  .ph b.on { background:#3a4a63; color:#e8edf5; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h3>时间轴（90 s 一轮）</h3>
    <div class="btns">
      <button id="bPlay">⏸ 暂停</button><button id="bStep">+1s</button><button id="bBack">−1s</button>
      <button id="bReset">t=0</button>
      <select id="selSpeed"><option value="1">1×</option><option value="3" selected>3×</option><option value="6">6×</option></select>
      <select id="selTier"><option>LOW</option><option selected>MED</option><option>HIGH</option></select>
    </div>
    <div class="row"><label>t（scrub）</label><input id="sT" type="range" min="0" max="90" step="0.05" value="0"><output id="oT"></output></div>
    <div class="ph" id="ph"></div>

    <h3>雾</h3>
    <div class="row"><label>D0 雾浓度尺度</label><input id="sD0" type="range" min="25" max="160" step="1" value="70"><output id="oD0"></output></div>
    <div class="row"><label>近端无雾距离</label><input id="sFN" type="range" min="0" max="25" step="0.5" value="8"><output id="oFN"></output></div>
    <div class="row"><label>流动雾 A 强度</label><input id="sFA" type="range" min="0" max="0.6" step="0.01" value="0.24"><output id="oFA"></output></div>
    <div class="row"><label>流动雾 B 强度</label><input id="sFB" type="range" min="0" max="0.6" step="0.01" value="0.28"><output id="oFB"></output></div>
    <div class="row"><label>贴地雾带</label><input id="sGB" type="range" min="0" max="0.8" step="0.01" value="0.40"><output id="oGB"></output></div>
    <div class="row"><label>雾裙厚度(m·世界系)</label><input id="sSKH" type="range" min="0" max="20" step="0.5" value="8"><output id="oSKH"></output></div>
    <div class="row"><label>雾裙强度</label><input id="sSKA" type="range" min="0" max="0.9" step="0.01" value="0.45"><output id="oSKA"></output></div>
    <div class="row"><label>落地冲击压雾</label><input id="sIMP" type="range" min="0" max="0.7" step="0.01" value="0.50"><output id="oIMP"></output></div>

    <h3>相机 / 尺度</h3>
    <div class="row"><label>地平线位置</label><input id="sHZ" type="range" min="0.35" max="0.8" step="0.005" value="0.58"><output id="oHZ"></output></div>
    <div class="row"><label>fz 透视强度(m)</label><input id="sFZ" type="range" min="20" max="160" step="1" value="60"><output id="oFZ"></output></div>
    <div class="row"><label>px/m 尺度</label><input id="sPPM" type="range" min="10" max="40" step="0.5" value="22"><output id="oPPM"></output></div>
    <div class="row"><label>甩镜倍率</label><input id="sYA" type="range" min="0" max="1.6" step="0.05" value="1"><output id="oYA"></output></div>
    <div class="row"><label>仰角上限(屏高)</label><input id="sTM" type="range" min="0" max="0.35" step="0.01" value="0.20"><output id="oTM"></output></div>

    <h3>巨影解剖</h3>
    <div class="row"><label>机身高度(m)</label><input id="sBY" type="range" min="14" max="40" step="0.5" value="30"><output id="oBY"></output></div>
    <div class="row"><label>大腿 L1(m)</label><input id="sL1" type="range" min="4" max="28" step="0.5" value="10"><output id="oL1"></output></div>
    <div class="row"><label>小腿 L2(m)</label><input id="sL2" type="range" min="14" max="44" step="0.5" value="34"><output id="oL2"></output></div>
    <div class="row"><label>膝上抬(m)</label><input id="sKU" type="range" min="0" max="24" step="0.5" value="13"><output id="oKU"></output></div>
    <div class="row"><label>膝外展(m)</label><input id="sKO" type="range" min="0" max="16" step="0.25" value="7"><output id="oKO"></output></div>
    <div class="row"><label>腿展 RF(m)</label><input id="sRF" type="range" min="6" max="24" step="0.25" value="15"><output id="oRF"></output></div>
    <div class="row"><label>机身宽(m)</label><input id="sBRX" type="range" min="3" max="12" step="0.1" value="6.4"><output id="oBRX"></output></div>
    <div class="row"><label>机身扁(m)</label><input id="sBRY" type="range" min="1" max="6" step="0.1" value="2.6"><output id="oBRY"></output></div>
    <div class="row"><label>机身呼吸深度</label><input id="sBRB" type="range" min="0" max="1.2" step="0.01" value="0.45"><output id="oBRB"></output></div>
    <div class="row"><label>掠过段负压强度</label><input id="sWAK" type="range" min="0" max="1" step="0.01" value="0.55"><output id="oWAK"></output></div>
    <div class="row"><label>头颈前伸(m)</label><input id="sHF" type="range" min="3" max="12" step="0.25" value="3.5"><output id="oHF"></output></div>
    <div class="row"><label>腿半径(m)</label><input id="sLR" type="range" min="0.15" max="1.5" step="0.05" value="0.6"><output id="oLR"></output></div>

    <h3>步态与姿态</h3>
    <div class="row"><label>步幅 STRIDE(m)</label><input id="sST" type="range" min="4" max="18" step="0.25" value="10"><output id="oST"></output></div>
    <div class="row"><label>抬腿(m)</label><input id="sLF" type="range" min="0" max="8" step="0.1" value="4.6"><output id="oLF"></output></div>
    <div class="row"><label>膝外弓</label><input id="sKB" type="range" min="0" max="0.4" step="0.01" value="0.14"><output id="oKB"></output></div>
    <div class="row"><label>前摆量(m)</label><input id="sOS" type="range" min="0" max="6" step="0.1" value="2.8"><output id="oOS"></output></div>
    <div class="row"><label>起伏 bob(m)</label><input id="sBO" type="range" min="0" max="3" step="0.05" value="0"><output id="oBO"></output></div>
    <div class="row"><label>横滚 roll(°)</label><input id="sRO" type="range" min="0" max="10" step="0.1" value="4"><output id="oRO"></output></div>
    <div class="row"><label>机身侧晃(m)</label><input id="sSW" type="range" min="0" max="4" step="0.1" value="1.9"><output id="oSW"></output></div>
    <div class="row"><label>机身俯仰(m)</label><input id="sPI" type="range" min="0" max="3" step="0.05" value="1.05"><output id="oPI"></output></div>
    <div class="row"><label>机头残差摆角(°)</label><input id="sHY" type="range" min="0" max="20" step="0.1" value="0"><output id="oHY"></output></div>
    <div class="row"><label>机头滞后占比</label><input id="sHK" type="range" min="0" max="1" step="0.01" value="0.13"><output id="oHK"></output></div>
    <div class="row"><label>手持抖动</label><input id="sSH" type="range" min="0" max="3" step="0.05" value="1"><output id="oSH"></output></div>
    <div class="row"><label>落地顶机（相机回弹）</label><input id="sJO" type="range" min="0" max="20" step="0.5" value="9"><output id="oJO"></output></div>

    <h3>真实感合成</h3>
    <div class="row"><label>胶片颗粒</label><input id="sGR" type="range" min="0" max="0.12" step="0.005" value="0.055"><output id="oGR"></output></div>
    <div class="row"><label>地平火光</label><input id="sEM" type="range" min="0" max="0.8" step="0.01" value="0.3"><output id="oEM"></output></div>

    <h3>行进路线</h3>
    <div class="row"><label>曲折总开关</label><input id="sWK" type="range" min="0" max="2.5" step="0.05" value="1"><output id="oWK"></output></div>
    <div class="row"><label>路线种子</label><input id="sRS" type="range" min="1" max="999" step="1" value="1"><output id="oRS"></output></div>
    <div class="row"><label>换路间隔(圈)</label><input id="sRL" type="range" min="1" max="6" step="1" value="2"><output id="oRL"></output></div>
    <div class="row"><label>剧本(-1=轮换)</label><input id="sRV" type="range" min="-1" max="2" step="1" value="-1"><output id="oRV"></output></div>
    <div class="row"><label>掠过/绕后编舞</label><input id="sEA" type="range" min="0" max="1.5" step="0.05" value="1"><output id="oEA"></output></div>

    <h3>热光光束</h3>
    <div class="row"><label>扫射幅度(m)</label><input id="sBA" type="range" min="0" max="90" step="1" value="34"><output id="oBA"></output></div>
    <div class="row"><label>扫射周期(s)</label><input id="sBP" type="range" min="4" max="30" step="0.5" value="10"><output id="oBP"></output></div>
    <div class="row"><label>光束亮度</label><input id="sBI" type="range" min="0" max="1.2" step="0.01" value="0.62"><output id="oBI"></output></div>
    <div class="row"><label>溅射火星密度(粒)</label><input id="sEN" type="range" min="8" max="48" step="2" value="24"><output id="oEN"></output></div>

    <h3>城郊建筑</h3>
    <div class="row"><label>中景密度</label><input id="sNB" type="range" min="0" max="34" step="1" value="22"><output id="oNB"></output></div>
    <div class="row"><label>近景密度</label><input id="sNK" type="range" min="0" max="14" step="1" value="8"><output id="oNK"></output></div>

    <h3>人群与抓取（R18）</h3>
    <div class="row"><label>人数</label><input id="sCN" type="range" min="0" max="24" step="1" value="8"><output id="oCN"></output></div>
    <div class="row"><label>抓取时刻(s)</label><input id="sGT" type="range" min="40" max="70" step="0.5" value="52"><output id="oGT"></output></div>
    <div class="row"><label>人在机器前方(m)</label><input id="sGD" type="range" min="-60" max="0" step="1" value="-25"><output id="oGD"></output></div>
    <div class="row"><label>缆须极限长(m)</label><input id="sTR" type="range" min="10" max="70" step="1" value="46"><output id="oTR"></output></div>
    <div class="row"><label>人群墨度</label><input id="sCI" type="range" min="0" max="2" step="0.05" value="1"><output id="oCI"></output></div>
    <div class="row"><label>溶解起点(lift)</label><input id="sCS" type="range" min="0" max="0.95" step="0.01" value="0.72"><output id="oCS"></output></div>
    <div class="row"><label>人群纪元种子</label><input id="sCS0" type="range" min="1" max="999" step="1" value="1"><output id="oCS0"></output></div>

    <h3>模拟音频（原型无音轨）</h3>
    <div class="row"><label>bass</label><input id="sBas" type="range" min="0" max="1" step="0.01" value="0.5"><output id="oBas"></output></div>
    <div class="row"><label>treble</label><input id="sTre" type="range" min="0" max="1" step="0.01" value="0.5"><output id="oTre"></output></div>
    <div class="row"><label>energy</label><input id="sEnr" type="range" min="0" max="1" step="0.01" value="0.5"><output id="oEnr"></output></div>
    <div class="row"><label>6 s 呼吸兜底</label><input id="cBre" type="checkbox"><output></output></div>

    <h3>自检 / 计量</h3>
    <div class="btns"><button id="bTest">▶ T1–T31（含负样本）</button><button id="bCost">▶ 测图元/铺屏</button></div>
    <div id="log"></div>
  </div>

  <div id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="hud"></div>
  </div>
</div>

<script>
(function () {
'use strict';
/* ══════════════════════════════════════════════════════════════════════════════
   E46「迷雾之战 · 雾中三脚巨影」浏览器原型 —— 纯 Canvas 2D，零依赖。

   与 docs/e46-tripod-fog-plan.md 的对应关系：
     §三  世界模型 / 投影        → pr() / toCam() / fromCam()
     §3.2 距离雾（核心机制）     → fogOf() / shade()
     §3.3 相机运动学（导出量）   → sceneState() 里的 camSpeed / C  ⛔ 不是脚本
     §3.4 步态按 G 距离驱动      → legState(i, s)，s = G/STRIDE
     §3.5 两连杆 IK              → ikKnee()
     §3.6 曲折行进路线           → routeMX() / routePSI()（⛔ 是 G 的纯函数）
     §五  雾四层                 → bakeFogStrip() + drawBase() + drawGroundBand()
     §六  光束地面扫射           → drawBeams()
     §七  建筑回收 + 两端淡入淡出 → instWrap() + bandWindow()（每栋自带周期）
     §八  90 s 闭合时间轴        → DH / VH / YH / buildCum()，闸门由 T4 把守

   ⚠️ 本文件产出的数字**只能由 __E46.stats() / __E46.selfTest() 再生**，
      ⛔ 不许手抄进方案文档或 Kotlin 注释（E44 偏差 D24 的成因）。
   ══════════════════════════════════════════════════════════════════════════════ */

// ───────────────────────────── 可调参数 ─────────────────────────────
const P = {
  LOOP: 90,
  D0: 70, fogNear: 8, fogA: 0.24, fogB: 0.28, groundBand: 0.40,
  // R25 掠过段负压（⚠️ 隔离项，见 §「可整体退回」注释）：0 即整条效果不存在。
  wakeA: 0.55,
  // R19：雾裙 = **世界系固定厚度**的一层贴地雾，烘进每栋楼自己的位图底部
  //（裙高 ÷ 该栋全高 = 位图系分数，与距离无关 ⇒ 零额外图元、零额外 pass）。
  // ⛔ 用屏幕固定高度的裙：那正是"每栋楼在同一行被切齐"的成因（R19）。
  skirtH: 8, skirtA: 0.45,
  // R22：落地冲击压雾的**强度**（几何常量在 IMPACT 表里，⛔ 散在绘制代码中）。
  //   0.50 是图判出来的：0.30 时那一圈只读成"脚底一块说不清的灰"（r26a），
  //   0.80 起中心压暗连成一片实心黑饼（r27c）；0.50 才读成"雾被踩出一个坑"（r27e）。
  impactA: 0.50,
  // R23 命中扬尘强度（几何常量在 DUST 表里）。⚠️ 它**不该**超过光束本身：α 式里再乘 poolVis，
  //   所以远处落点的尘会被雾吃掉，⛔ 靠这个滑杆去"补亮度"（那等于给远景加自发光）。
  dustA: 0.55,
  horizonK: 0.58, fz: 60, ppm: 22, eye: 1.7, yawAmp: 1, tiltMax: 0.20,
  // ── 解剖（判读轮 2 重做，⛔ 回到第一版的"起落架顶个飞碟"）────────────────
  // 参考图三条腿是**大跨步弓开的细长弯腿**，脚点半径远大于机身半径；
  // 第一版 RF 9 / RH 3.2 / 腿长 17+17 ⇒ 腿近乎竖直贴在机身下，整机读成"悬在
  // 三根棍子上的椭圆碟"。现在 RF 15 / 腿长 10+34 / bodyY 30 ⇒ 拱形站姿 + 26→34 m 机高，
  // 最近位虽然从 32 m 退到 60 m，屏幕尺寸反而略涨（§3.1 由 harness 再生）。
  bodyY: 30, L1: 10, L2: 34, RH: 4.0, RF: 15,
  // ⭐ 膝关节（判读轮 4 R11）：膝**高于髋、且在脚的外侧**，前视读成马蹄拱形。
  //    旧口径是解析 IK 的"肘部提示向量" = 纯水平外法向 ⇒ 膝必然落在髋脚连线**下方**
  //    且夹在髋与脚之间，于是身后那条腿投影成一根竖起的尖刺、机身被衬得像个顶针。
  //    现在膝目标点 = 髋 + (外法向·kneeOut, kneeUp, ·)，IK 只负责在"朝这个目标弯"的约束下
  //    解出定长两连杆 ⇒ 段长恒定，⛔ 目标点不参与长度、不会把腿拉长。
  //    ⚠️ L1/L2 是**两条反向约束夹出来的**，⛔ 任一条单独调都会翻车：
  //      (a) 膝要翻到髋上方须 a=(D²+L1²−L2²)/2D < 0 ⇔ L2² > D²+L1²（腿近竖直时膝只能在
  //          垂直于髋脚轴的平面内横移，perp_y≤√(1−uy²)→0，kneeUp 再大也饱和 —— 实测
  //          kneeUp 9→13 只把最小膝高从 −1.1 挪到 −1.0 m）。取 D≈32 ⇒ L2 ≳ 33。
  //      (b) 膝顶高度 ≈ |uy·a| + √(1−uy²)·h，而 h≤L1 ⇒ **L1 直接决定膝能拱多高**。
  //          L1=15 时膝顶到髋上 ~10 m（36 m 高，比机顶 33.8 还高）⇒ 压迫位膝被顶出画面上沿，
  //          三条腿读成"从天花板垂下来的钩子"。L1=10 把膝顶压回髋上 ~4 m（≈机顶同高）。
  kneeUp: 13, kneeOut: 7,
  // 甲壳（半轴比机身"长 12 m 高 3 m"的原口径更鼓，⛔ 完美椭圆 = 飞碟感的另一半成因）
  bodyRx: 6.4, bodyRy: 2.6, bodyLump: 0.16,
  // R24 机身呼吸：**只调 bodyLump 的幅度**（顶点谐波），⛔ 调半径、⛔ 调位置。
  //   半径一呼吸，cowlY() / tendrilRoot / 腺囊三处口径就分叉（它们都直接读 bodyRx/bodyRy），
  //   §3.1 的整机高度跟着漂、缆须根部还会从腹缘脱开；位置一呼吸就是已被否掉的 bobA（意见 2）。
  //   breathHz = 1/18 ⇒ 一圈 5 次呼吸，必须整除 LOOP=90（§八 独立复核 + breathPh 进 T4 指纹）。
  breathA: 0.45, breathHz: 1 / 18,
  // 顶罩（cowl）：机顶凸起的小舱，**topY() 的唯一口径**
  cowlRx: 3.1, cowlRy: 1.6, cowlFwd: 1.4,
  // 前下腺囊 = 两道热光的出处
  // ⭐ R28（判读轮 6 意见 2「头部和身体还是分开的，要合成一体」）：旧口径 headFwd 7.0 / headDown 2.4
  //   把腺囊推到甲壳**前下方各 2 m 开外**（甲壳腹缘在 bodyY−2.6，腺囊中心在 bodyY−2.4、半轴 2.0
  //   ⇒ 整颗球几乎挂在腹缘之下），再加上它比甲壳深 30% ⇒ 实拍帧读成"机身下吊了一颗单独的深色球"

// ───────────────────────────── 小工具 ─────────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / ((e1 - e0) || 1e-9), 0, 1); return t * t * (3 - 2 * t); }
function easeInOut(w) { return w < 0.5 ? 2 * w * w : 1 - Math.pow(-2 * w + 2, 2) / 2; }
function mix3(c0, c1, t) { return [lerp(c0[0], c1[0], t), lerp(c0[1], c1[1], t), lerp(c0[2], c1[2], t)]; }
function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(4) + ')'; }
function lum(c) { return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
function lcg(seed) { let s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

// ─────────────── 单调三次 Hermite（Fritsch–Carlson，§八） ───────────────
function hermite(kx, ky) {
  const n = kx.length - 1, dl = [], m = new Array(kx.length).fill(0);
  for (let i = 0; i < n; i++) dl.push((ky[i + 1] - ky[i]) / (kx[i + 1] - kx[i]));
  m[0] = dl[0]; m[n] = dl[n - 1];
  for (let i = 1; i < n; i++) m[i] = (dl[i - 1] * dl[i] <= 0) ? 0 : (dl[i - 1] + dl[i]) / 2;
  for (let i = 0; i < n; i++) {
    if (dl[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / dl[i], b = m[i + 1] / dl[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * dl[i]; m[i + 1] = t * b * dl[i]; }
  }
  return { kx: kx, ky: ky.slice(), m: m, n: n };
}
/** ⭐ R29 原地重建一条 hermite 的 ky/m（⛔ 换新对象：window.__E46、crowdTable 的 DH.ky[0]
 *  与闸门拿的都是**同一份引用**，换成新对象就等于让画面读旧表、闸门读新表 —— 两套口径）。
 *  kx 在剧本之间是**共用的网格**，所以 n 不用动。 */
function setHermite(H, kx, ky) { const h = hermite(kx, ky); H.ky = h.ky; H.m = h.m; }
function hIdx(H, x) { let i = 0; while (i < H.n - 1 && x > H.kx[i + 1]) i++; return i; }
function hEval(H, x) {
  if (x <= H.kx[0]) return H.ky[0];
  if (x >= H.kx[H.n]) return H.ky[H.n];
  const i = hIdx(H, x), h = H.kx[i + 1] - H.kx[i], t = (x - H.kx[i]) / h;
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * H.ky[i] + (t3 - 2 * t2 + t) * h * H.m[i]
       + (-2 * t3 + 3 * t2) * H.ky[i + 1] + (t3 - t2) * h * H.m[i + 1];
}
function hDeriv(H, x) {
  if (x <= H.kx[0]) return (H.ky[1] - H.ky[0]) / (H.kx[1] - H.kx[0]);
  if (x >= H.kx[H.n]) return (H.ky[H.n] - H.ky[H.n - 1]) / (H.kx[H.n] - H.kx[H.n - 1]);
  const i = hIdx(H, x), h = H.kx[i + 1] - H.kx[i], t = (x - H.kx[i]) / h, t2 = t * t;
  return (6 * t2 - 6 * t) * H.ky[i] / h + (3 * t2 - 4 * t + 1) * H.m[i]
       + (-6 * t2 + 6 * t) * H.ky[i + 1] / h + (3 * t2 - 2 * t) * H.m[i + 1];
}
function pw(kx, ky, x) {
  if (x <= kx[0]) return ky[0];
  if (x >= kx[kx.length - 1]) return ky[ky.length - 1];
  let i = 0; while (i < kx.length - 2 && x > kx[i + 1]) i++;
  return lerp(ky[i], ky[i + 1], (x - kx[i]) / (kx[i + 1] - kx[i]));
}

 *  "揭示时正中身后"全毁（T7 / T18 都抓得住）。
 *  ⭐ R17 谷心 GW 改成**掠过瞬间** gAt(TCROSS.t1)，⛔ 不再是"全局最小 d"：
 *     R17 之后 d 一圈穿越 0 两次，全局最小 d 是穿越②（t≈79、−70 m 那一支的过零邻域），
 *     拿它当谷心会把随机游走压到归位段、而放任掠过段挂着满幅侧移。 */
let GW = 120;
function setWanderCenter() { GW = gAt(TCROSS.t1); }
const dWrap = (a, b) => mod(a - b + GTOT / 2, GTOT) - GTOT / 2;
function wanderEnv(G) {
  return smoothstep(GTOT * P.wValleyA, GTOT * P.wValleyB, Math.abs(dWrap(G, GW)));
}
/** 机身在地面系里的横向偏移（m）= **随机游走项 + 编舞项**，两项各有各的闭合方式。
 *  · wK 是随机游走的总开关：0 = 退回旧行为（正对镜头直着走过来），T12 的负样本靠它。
 *  · escAmp 是编舞项的总开关：0 = 没有掠过也没有绕后，T18 的负样本靠它。
 *  · (1−escEnv) 把随机游走在编舞段**压掉**，escEnv 把编舞接进来 —— ⛔ 两件事必须同时做，
 *    只做后者会让 ±55 m 的随机幅值叠在 16 m 的编舞小弧上。
 *  · seamEnv ⛔ **只乘随机游走项**（见 seamEnv 注释）。
 *  · ⭐ **G 是圆周量，所有取值先回绕**（见 Gw）。 */
const wanderPart = (G) => { G = Gw(G); return P.wK * seamEnv(G) * (1 - escEnv(G)) * wanderEnv(G) * pathBase(G); };
const choreoPart = (G) => { G = Gw(G); return P.escAmp * escEnv(G) * choreoMX(G); };
const routeMX = (G) => wanderPart(G) + choreoPart(G);
/** ⭐ R17：T12 (c) / scanRoute 的「回到正前方」判据取值层 —— **不含 escEnv 门**的随机游走项。
 *  ⛔ 判据不能取 routeMX：GAIM = gAt(56) 正好落在 escEnv 的 0→1 交接坡道上（escEnv(GAIM)=1.000），
 *     那里的 ψ 由「随机游走让位给编舞」的交接导数主导（实测 routePSI(GAIM) = 9.8°，
 *     整条坡道最大 24.9°），量的是交接而不是"路线有没有收回来"⇒ 200 个种子全部误判为不达标，
 *     拒绝采样连抽 80 次也抽不到一条（实测均值 80.0 = 完全失效）。
 *  取 wanderRaw 之后同一点是 0.085 m / −2.27°（200 种子最大 0.2 m / 5.1°），
 *  而把谷壁塌掉（wValleyA/B→0）立刻变成 61.6 m ⇒ 负样本咬得住，⛔ 不是假判据。 */
const wanderRaw = (G) => { G = Gw(G); return P.wK * seamEnv(G) * wanderEnv(G) * pathBase(G); };
const wanderRawPSI = (G) => { const h = 0.5; return Math.atan((wanderRaw(G + h) - wanderRaw(G - h)) / (2 * h)); };
/** T12 (g) 换路接缝判据的取值层：只含 seamEnv·pathBase。
 *  ⛔ 判据不能取 routeMX —— R17 之后 GW 是掠过瞬间（G≈GTOT·0.52），wanderEnv 的谷不再跨接缝，
 *  但编舞项在接缝处本来就是 0（CH_TY 首末两对都是 0），拆掉 seamEnv 也量不出跳变 ⇒ 假判据。
 *  ⛔ 也不含 P.wK（总开关为 0 时同样恒 0）。 */
const routeRaw = (G) => { G = Gw(G); return seamEnv(G) * pathBase(G); };
/** ψ = 行进方向 = atan(dx/dG)。⛔ 归一化成弧长参数：|x′| ≤ 0.6 时对地速度与步幅的误差
 *  ≤ 17%，肉眼读不出，而省掉一张数值积分表（Kotlin 侧同一条理由）。
 *  中心差分而不是解析导数：包络是 smoothstep×谐波，解析式又长又容易和实现走岔。 */
const routePSI = (G) => { const h = 0.5; return Math.atan((routeMX(G + h) - routeMX(G - h)) / (2 * h)); };

// ─────────────────────── 距离雾（§3.2 核心机制） ───────────────────────
/** ⚠️ D0 必须可从外部传入：`energy → 雾密度` 是本设计仅有的两条音频响应之一，
 *  sceneState 算出的 st.D0 若无人消费，那条滑杆就是死的（原型第一版正是如此）。 */
function fogOf(d, D0) { return 1 - Math.exp(-Math.max(0, d - P.fogNear) / (D0 || P.D0)); }
/** 背景本身已是雾色 ⇒ "降 alpha" 与 "混进雾色" 是同一件事的两种写法；Kotlin 侧只留 alpha 一条 */
function shade(d, D0) { const f = clamp(fogOf(d, D0), 0, 0.995); return { col: mix3(CFG.SILH, CFG.FOG, f * 0.45), a: 1 - f, fog: f }; }
/** 剪影落在背景上的实际对比度（T3 的判据口径） */
function contrastAt(d, D0) { const bg = mix3(CFG.GND, CFG.FOG, 0.55), res = mix3(bg, CFG.SILH, shade(d, D0).a); return Math.abs(lum(res) - lum(bg)) / lum(bg); }

// ─────────────────────── 相机与投影（§三） ───────────────────────
let W = 960, H = 540, cx = 480, hz = 313, PPM = 22;
function layout(w, h) { W = w; H = h; cx = w / 2; hz = h * P.horizonK; PPM = P.ppm * Math.min(w, h) / 540; }
function toCam(x, z, yaw) { const c = Math.cos(yaw), s = Math.sin(yaw); return { lat: x * c - z * s, along: z * c + x * s }; }
function fromCam(lat, along, yaw) { const c = Math.cos(yaw), s = Math.sin(yaw); return { x: lat * c + along * s, z: -lat * s + along * c }; }
/** along < 0.5 ⇒ 已在相机背后，返回 null 由调用方剔除 */
function pr(x, y, z, yaw) {
  const p = toCam(x, z, yaw);
  if (p.along < 0.5) return null;
  const s = P.fz / (P.fz + p.along);
  return { X: cx + p.lat * PPM * s, Y: hz + (P.eye - y) * PPM * s, s: s, along: p.along };
}

// ─────────────────────── 步态（§3.4 按 G 距离驱动） ───────────────────────
// ⚠️️ 方位角是判读轮 2 抓到的**头号造型事故**：第一版写 `[180°, 120°, 240°]` 并注释成
//    「一腿在后、两腿在前跨住相机」—— 但 cos120° = cos240° = **−0.5**，那两条腿的落点在
//    机身**后面** 0.5·RF 处。三条腿全拖在身后、机身悬在空地上方，投影出来就是一枚
//    「起落架朝后的飞碟」。正确值 cos60° = +0.5 ⇒ `[180°, 60°, 300°]`：一腿直后、
//    两腿向相机方向大跨弓开（参考图 1/3/4 全是这个剪影）。
//    ⛔ 也不要退回 [0°,120°,240°]：th=0 那条腿正对相机（lat=0），会挂在机身和两道光中间，
//    压迫位读成「一根棍子插着头」。
const LEG_AZ = [Math.PI, TAU / 6, 5 * TAU / 6];
function legState(i, s) {
  const th = LEG_AZ[i], ct = Math.cos(th), sth = Math.sin(th);
  const c = s - i / 3, u = c - Math.floor(c);
  const qA = P.RF * ct - P.STRIDE / 3;
  const qB = P.RF * ct + P.STRIDE / 3;
  let q, lift = 0, reach = 0;
  if (u < 1 / 3) {
    const w = u * 3;
    lift = P.lift * Math.sin(Math.PI * w);
    // 摆动相沿**腿自己的方位角**向外前探出 arc 米 ⇒ 抬腿走弧线。
    // ⛔ 只平移 q 不抬 lat：腿会在原地直上直下，读成雨刷而不是迈步。
    reach = P.outSwing * Math.sin(Math.PI * w);
    q = lerp(qA, qB, easeInOut(w)) + reach * ct;
  } else { q = qB - (u - 1 / 3) * P.STRIDE; }
  return { lat: P.RF * sth + reach * sth, q: q, lift: lift, th: th, swing: u < 1 / 3, u: u };
}
/** 脚的**地面系**坐标 = 相机系 + 相机行程 C。整个站立相里它必须一动不动 ⇔ 零滑步（T2）。
 *  ⚠️ 为什么加 C：`d + C ≡ d(0) − G`（C 是 §3.3 的导出量），所以"相机系 z 加 C"正是把当前帧
 *  搬回**不随相机走**的地面系。一维版 `footWorldZ = d − q + C` 已被二维口径取代 ——
 *  曲折路线下脚会在横向上画弧，而横移完全不改变深度，只看 z 等于没测。 */
const groundFoot = (st, L) => ({ x: L.fx, z: L.fz + st.C });

/** R22 落地冲击压雾：脚掌**触地后** win 个步幅内，把贴地雾向外排开 ——
 *  中心一处变暗（雾被打散、露出更暗的地面）+ 一圈外扩的压缩雾环。
 *  ⛔ 任何随时间累积/自带频率的量：整条包络是 `u` 的纯函数，而 `u = frac(G/STRIDE − i/3)`
 *     已由 buildCum() 钉成整周期（G(LOOP)=GTOT=整数×STRIDE）⇒ R15 的整周期纪律**自动成立**，
 *     不需要新的关键帧，也不给 T4 添新圆周量。
 *  ⚠️ win 必须 < 1/3：三条腿的 u 彼此错开 1/3 步幅，win < 1/3 ⇔ 同帧最多一条腿在冲击窗内
 *     ⇔ 这一层最多付 1 个图元（闸门 T21(b) 就是数这个）。 */
const IMPACT = { win: 0.22, phase: 1 / 3, rIn: 2.2, rOut: 8.0, squash: 0.30, dip: 0.55, attack: 0.06 };
/** 换相以来的进度：0 = 触地那一瞬，1 = 冲击窗结束（≥1 ⇒ 本帧无冲击）。
 *  ⚠️ `phase` 就是 legState 里"u<1/3 为摆动相"的那个换相点，⛔ 滑杆（改它 = 改步态）。
 *  它单独进表只为了闸门能把它挪到摆动相去当**负样本 B**。 */
const impProgress = (u) => mod(u - IMPACT.phase, 1) / IMPACT.win;
/** 快起慢落的冲击包络，**两端恒为 0**：⛔ 用阶跃起波，那会在换相那一帧留一个不连续点，
 *  而 t=0 恰好落在腿 2 的触地上（u=1/3）⇒ 循环接缝会被这个跳变咬到。 */
function footImp(u) {
  const w = impProgress(u);
  if (!(w >= 0 && w < 1)) return 0;
  return clamp(Math.pow(1 - w, 1.5) * Math.min(1, w / IMPACT.attack), 0, 1);
}
/** R22 闸门记录：drawTripod 里**每一条 imp>0 的腿**都被记一次（`on` = 这一帧真落了笔），
 *  render() 每帧清空。⛔ 闸门自己重算 rx/α —— 那是第二套口径，画面改了闸门还绿着。 */
const IMPACT_REC = [];

/** R26 步频冲击的**形状**参数（幅度在 `P.joltA`，是观感旋钮；这三个不是，⛔ 滑杆）。
 *  · cyc：一记冲击里含几个完整回弹周期（1 = 下沉一次、回抽一次、归零）。
 *  · dIn/dOut：距离包络两端（m）。⛔ 用 `st.d`：机器绕到侧面时两者差 20%+，
 *    按 d 算会在它其实贴着镜头时把相机晃掐掉。
 *  · xK：横向串扰比 —— 纯竖直晃读成地震，掺一点横向才像**手持被顶了一下**。
 *  · legK = 3：三条腿的落地都顶相机。置 1 = 只挂第一条腿（闸门 T25(a) 的负样本 ——
 *    另外两记落地凭空没有回弹，⛔ 在绘制/状态里另写一条"漏腿"的分支）。 */
const JOLT = { cyc: 1, dIn: 20, dOut: 90, xK: 0.3, legK: 3 };

/** R23 命中扬尘：光束落点处**被照亮的尘柱**（+ 把落点亮斑的内圈改烫 = "烧亮的地面"，零成本）。
 *  ⛔ 自带频率：尘柱的姿态完全由扫射的**解析导数** st.beamSwV 给出，亮度完全由 st.beamI 给出
 *     —— beamI 里已经乘过 fireEnv ⇒ 掠过/揭示/绕后三段自动为零（闸门 T23(a) 判这条）。
 *  ⚠️ 每道光一个图元、只在 MED/HIGH 付（LOW 档连发射口光晕都不画，扬尘更不该例外）。
 *  ⭐ R31 意见 1「光柱前端那团光还在」：**整层默认不再画**（`on = 0`）。落点上方那颗悬空的
 *     加色尘球（半径 = 亮斑 1.75 倍、中心还抬起 1.15 倍亮斑半径）在实拍里比光柱本身还显眼，
 *     读成"光柱顶着一团灯"——正是所有者两次点名的那个缺陷。所有者点名要留的是**地面的光斑**，
 *     亮斑与它的烫内圈（R23「亮面」）原样保留。代码与 DUST_REC 只服务 T23(a) 的负样本，
 *     ⛔ 把 `on` 当成"可以配回旧样子"的开关：判读轮 8 要看的三档画面里它就是不存在。 */
const DUST = { on: 0, r: 1.75, rise: 1.15, leanK: 0.11, squash: 0.62,
               fireK: 1, floor: 0, tierK: 1, derK: 1 };
/** R23 闸门旋钮（⛔ 不给滑杆，平时恒为默认值）—— 每个旋钮只服务一条负样本：
 *  · fireK = 1：亮度吃 st.beamI（里面已乘 fireEnv）。置 0 = "忘了吃"的那种写法（T23(a) 负样本 A）
 *  · floor = 0：⛔ 最低可见度。>0 就是"给扬尘自己一条亮度曲线"，T23(a) 的同比例判据咬住
 *  · tierK = 1：LOW 档不画。置 0 = 无视档位（T23(d) 的负样本 —— 低端机上一帧多两个全屏级渐变）
 *  · derK = 1：侧倾吃扫**速**。置 0 = 拿**位移** beamSw 冒充速度（同幅、相位差 90°，
 *      "看着也在晃"，但尘会在光扫得最快时反而回正、在光停住的极值处歪到最大 —— T23(b) 对账中央差分咬住） */
/** R23 闸门记录：drawBeams 里**每一个落点**都记一次（`on` = 这一帧真落了笔），render() 每帧清空。
 *  连同当帧的 fire / beamI 一起记 ⇒ T23(a) 能直接查"熄灯帧仍有尘"这种违例，⛔ 事后重推。 */
const DUST_REC = [];

/** R24 机身呼吸：三段（甲壳 / 顶罩 / 腺囊）各一个**相位偏移**（单位：圈，⛔ 取整齐的 1/3 ——
 *  那样甲壳鼓出去时顶罩正好凹进来，屏幕上互相抵消；取无理一点的间距才读成"皮下蠕动"）。
 *  不同相是这条细节的全部价值所在 —— 同相 = 整机在缩放（读成气球）。
 *  闸门 T24(b) 的负样本就是把这三个数一起归零（⛔ 为负样本另开一条死分支）。
 *  radK = 0：⛔ 把呼吸乘到**半径**上。半径是 cowlY()（⇒ §3.1 整机高度）与 tendrilRoot
 *  （⇒ 缆须根部贴不贴得住腹缘）的共同口径，一呼吸就两处一起分叉 —— T24(c) 的负样本走这条。 */
const BREATH = { ph: [0, 0.37, 0.71], radK: 0 };
/** R24 闸门记录：drawBody 每帧写下**它真的用出去的**谐波乘值与落笔顶/底缘。
 *  lumpPath 现在返回自己的 Y 极值 ⇒ 顶缘是绘制顶点里读出来的，⛔ 在闸门里重推一条包络式
 *  （E44 的 D24 教训：手推的"峰值 ≤0.33"活了整份文档，其实是缕尺寸按 0 算出来的假数）。 */
const BREATH_REC = [];

/** R25 掠过段负压 —— ⚠️ **隔离项**：整条效果 = `P.wakeA` 一个参数 + `drawFootWake()` 一个函数
 *  + `render()` 里一行调用，与 R19/R22/R23/R24 不共用代码路径。判读不合格就删那一行调用、
 *  wakeA 归零即可整体退回，⛔ 不要把它拆散进别的绘制函数（那退起来就是一刀一刀）。
 *  机器贴身掠过时把贴地雾**推开**：每只触地脚外圈一道压缩雾脊，脊心之间留一条低压通道
 *  —— 通道只能用"雾被堆到两侧"来暗示，⛔ 为"擦掉雾"再加一遍全屏 pass（直接撞 R8 铺屏预算，
 *  而且擦不出背景：贴地雾带之下是已经画完的地面与楼，没有可露出的层）。
 *  ⛔ 自带频率：包络只由**当帧的脚位真距离**给（脚位是 `st` 的纯函数，`st` 已在 T4 指纹里）
 *  ⇒ 不新增圆周量、不进指纹、不需要关键帧。
 *  · d0/d1：包络的两个距离锚（m）。fd ≥ d0 ⇒ 0；fd ≤ d1 ⇒ 1。d0 取 45 m 是"已经在跟前"，
 *    d1 取 12 m ≈ 最近位，保证最强的一记正好落在掠过那一瞬。
 *  · side/thick：脊心离**本只脚接触点**的横向距离、脊的半径，都以接触影的落笔半宽为单位
 *    （`P.legR·4.6·PPM·q.s`，与 R22 同一尺度源）⇒ 改腿尺寸不用重调，⛔ 用机身半宽当单位：
 *    贴近那一瞬机身顶缘在画外，拿它当尺子量出来的东西在画面里没有对应物。
 *  · dip：通道中心的暗度（露出更暗的地面，同 R22 的 dk 口径）。
 *  · tierK：LOW 档不画（与 R23 同一档纪律：低端机连第二层雾和暗角都省了，负压更不该例外）。
 *  · ⛔ 闸门 T31 专用旋钮（平时恒为默认值、⛔ 上不进滑杆 —— 与 EM/BM/DUST 同一纪律）：
 *      anchorK 锚点插值 0=本只脚 / 1=三脚均值 ⇒ T31(a) 的负样本（R25 第一版的真实缺陷）；
 *      slipK   把落笔点朝屏幕中心拉 s 比例 ⇒ T31(b) 的负样本（脊"粘在屏幕上"，横向速度归零）；
 *      dupK    每只脚画几遍 ⇒ T31(f) 的负样本（画面看不出差别，图元翻倍 —— 创维吃的是 disjoint 数）。 */
const WAKE = { d0: 45, d1: 12, side: 1.35, thick: 1.1, dip: 0.45, cap: 0.30, tierK: 1,
               anchorK: 0, slipK: 0, dupK: 1 };
/** R25 闸门记录：drawFootWake 每帧写下**这一帧真落了笔**的脊/通道参数（未落笔时长度为 0）。
 *  ⭐ 每条带 `fx`（本只脚接触点的投影 X）与 `rx`（接触影半宽 = 尺度源），T31(a)(b) 判的就是
 *     落笔点与**这只脚自己**的关系 —— ⛔ 闸门重投影一遍脚位，那又是两套口径（T20 的纪律）。 */
const WAKE_REC = [];


// ─────────────────────── 两连杆 IK（§3.5） ───────────────────────
/**
 * 解膝点。**第 7~9 个参数是膝的目标点**（R11），⛔ 不是旧版的"外法向提示向量"。

    z: m * m * a.z + 2 * m * u * c.z + u * u * b.z }; };

  g.addColorStop(0.62, rgba(sh.col, sh.a));
  g.addColorStop(1, rgba(mix3(sh.col, CFG.RIM, 0.30), sh.a));

  for (const q of L.concat(R)) { x0 = Math.min(x0, q.X); x1 = Math.max(x1, q.X); y0 = Math.min(y0, q.Y); y1 = Math.max(y1, q.Y); }

/** 闸门专用的"临时换戏"：跑完把 CURVAR 与剧本占用的 P 字段精确还原。
 *  ⚠️ 剧本表是**原地改** DH/YH、重新赋值 CH_TY/ESC_TY/PHASES，没有"另一份"可回退
 *     ⇒ 还原 = 再套一次原剧本（applyVariant 是幂等的重建）。
 *  ⛔ 在 fn 里改 P 的其他字段（yawAmp / tiltMax / wValley*…）由调用方自己负责还原 ——
 *     withVariant 只管它自己动过的那几项，管多了会把调用方的负样本悄悄擦掉。 */
function withVariant(vi, fn) {
  const v0 = CURVAR, f0 = P.fireT0, f1 = P.fireT1, g0 = P.grabT, y0 = P.yawAmp;
  try {
    applyVariant(vi, true);
    return fn();
  } finally {
    CURVAR = -1;                       // ⛔ 绕过 applyVariant 的"同一套就跳过"短路
    applyVariant(v0, true);
    P.fireT0 = f0; P.fireT1 = f1; P.yawAmp = y0;
    setParam('grabT', g0); setGrabKnots(); _ct = null;
  }
}

// ─────────────────────── 自检 T1–T31（§十二，全部带负样本） ──────────────────────
function selfTest() {
  const out = [];
  // T1 投影 yaw 正逆互逆
  (function () {
    let worst = 0; const r = lcg(11);
    for (let i = 0; i < 4000; i++) {
      const x = (r() - 0.5) * 400, z = r() * 320 + 5, A = (r() - 0.5) * 3.2;
      const c = toCam(x, z, A), b = fromCam(c.lat, c.along, A);
      worst = Math.max(worst, Math.abs(b.x - x), Math.abs(b.z - z));
    }
    let neg = 0; const r2 = lcg(11);
    for (let i = 0; i < 400; i++) {
      const x = (r2() - 0.5) * 400, z = r2() * 320 + 5, A = (r2() - 0.5) * 3.2;
      const c = toCam(x, z, A), b = fromCam(c.lat, c.along, -A);
      neg = Math.max(neg, Math.abs(b.x - x));
    }
    out.push({ id: 'T1', name: '投影 yaw 正逆互逆', pass: worst < 1e-9,
      val: '最大往返误差 ' + worst.toExponential(2) + ' m', neg: '负样本：反变换取 −A ⇒ 误差 ' + neg.toFixed(1) + ' m' });
  })();
  // T2 站立相零滑步（**二维**口径 —— 曲折路线让一维口径变成假绿）
  (function () {
    const dt = 1 / 240; let worst = 0, n = 0;
    for (let i = 0; i * dt < P.LOOP - dt; i++) {
      const t = i * dt, s0 = sceneState(t), s1 = sceneState(t + dt);
      for (let l = 0; l < 3; l++) {
        if (s0.legs[l].swing || s1.legs[l].swing) continue;
        const a = groundFoot(s0, s0.legs[l]), b = groundFoot(s1, s1.legs[l]);
        worst = Math.max(worst, Math.hypot(b.x - a.x, b.z - a.z)); n++;
      }
    }
    const slip = worst / dt;
    // 负样本：**只换一处** —— 站立脚用「当前 ψ、当前 mx」求值（⛔ 着地瞬间的 ψ(Gp)/mx(Gp)），
    //        机身一转身，本该钉死的脚就绕机心画弧。这正是曲折路线最容易写错的那一行。
    //        负样本里把 wK 临时拉到 2.5：转身越凶滑移越大，⛔ 拿默认值凑一个刚过线的小数。
    const pinBad = (st, L) => {
      const Gp = st.G - (L.u - 1 / 3) * P.STRIDE;
      const lp = P.RF * Math.sin(L.th), qp = P.RF * Math.cos(L.th) + P.STRIDE / 3;
      const p = bodyFrame(lp, qp, 0, st.psi, st.d + (st.G - Gp), st.mx);
      return { x: p.x, z: p.z + st.C };
    };
    const savedK = P.wK; P.wK = 2.5;
    let neg = 0;
    for (let i = 0; i * dt < P.LOOP - dt; i++) {
      const t = i * dt, s0 = sceneState(t), s1 = sceneState(t + dt);
      for (let l = 0; l < 3; l++) {
        if (s0.legs[l].swing || s1.legs[l].swing) continue;
        const a = pinBad(s0, s0.legs[l]), b = pinBad(s1, s1.legs[l]);
        neg = Math.max(neg, Math.hypot(b.x - a.x, b.z - a.z) / dt);
      }
    }
    P.wK = savedK;
    // ⭐ R16：零滑步必须在**随机路线**下也成立 —— 站立脚钉点用的是 ψ(Gp)/mx(Gp)，
    //    路线换成任何种子都不该漂。4 个种子复扫（主判据仍是上面全分辨率那遍）。
    const savedRA = RA.slice(), savedRP = RP.slice();
    let seedSlip = 0, seedAt = 0;
    for (let sd = 1; sd <= 4; sd++) {
      applyRoute(P.routeSeed0 + sd * 37);
      let w = 0;
      for (let i = 0; i * dt < P.LOOP - dt; i += 4) {
        const t = i * dt, s0 = sceneState(t), s1 = sceneState(t + dt);
        for (let l = 0; l < 3; l++) {
          if (s0.legs[l].swing || s1.legs[l].swing) continue;
          const a = groundFoot(s0, s0.legs[l]), b = groundFoot(s1, s1.legs[l]);
          w = Math.max(w, Math.hypot(b.x - a.x, b.z - a.z));
        }
      }
      if (w / dt > seedSlip) { seedSlip = w / dt; seedAt = sd; }
    }
    RA = savedRA; RP = savedRP;
    out.push({ id: 'T2', name: '步态按 G 距离驱动（站立相二维零滑步，含 4 个随机路线种子）',
      pass: slip < 1e-3 && neg > 0.5 && seedSlip < 1e-3,
      val: '峰值滑移 ' + slip.toExponential(2) + ' m/s（' + n + ' 次采样，判 (x, z+C) 双分量）；4 个随机路线种子最大 '
         + seedSlip.toExponential(2) + ' m/s（种子 ' + seedAt + '）',
      neg: '负样本：站立脚改用以**当前** ψ/mx 求值（wK 临时 2.5）⇒ 滑移 ' + neg.toFixed(2) + ' m/s' });
  })();
  // T3 距离雾严格单调 + 接缝位对比度 < 5%
  (function () {
    let mono = true, prev = -1;
    for (let d = P.fogNear; d <= 800; d += 0.5) { const f = fogOf(d); if (f <= prev) mono = false; prev = f; }
    // ⭐ R17：判据取**路线表首末拍真实出现过的距离**，⛔ 硬编码 300。
    //   旧写法是 `contrastAt(300) < 3%`，而 R17 把 DH 尾段改平到 220 m 之后一圈里根本到不了 300 m ——
    //   它照样绿，但考的是一个不存在的位形，"跨圈把整机藏进雾里"这件事已经没人守了。
    //   循环接缝成立的前提正是 t=0 / t=LOOP 那两帧看不见机器 ⇒ 判据落在 DH 首末拍。
    const dSeam = Math.max(DH.ky[0], DH.ky[DH.ky.length - 1]);
    const c = contrastAt(dSeam), cFar = contrastAt(300), hard = (function () {
      const bg = mix3(CFG.GND, CFG.FOG, 0.55), res = mix3(bg, CFG.SILH, 0.1);
      return Math.abs(lum(res) - lum(bg)) / lum(bg);
    })();
    out.push({ id: 'T3', name: '距离雾严格单调 + 接缝位（d=' + dSeam.toFixed(0) + ' m）对比度 < 5%',
      pass: mono && c < 0.05 && cFar < 0.03,
      val: '单调=' + mono + '，接缝位 ' + dSeam.toFixed(0) + ' m 对比度 ' + (c * 100).toFixed(2)
         + '%（<5% ⇒ 跨圈那两帧整机藏得住）；d=300 远场 ' + (cFar * 100).toFixed(2) + '%（雾曲线上界，保留为回归哨兵）',
      neg: '负样本：fog() 换成硬钳 α=0.1 ⇒ 对比度 ' + (hard * 100).toFixed(1) + '%' });
  })();
  // T4 90 s 循环接缝逐字段闭合
  (function () {
    const seam = () => {
      const a = fingerprint(sceneState(0)), b = fingerprint(sceneState(P.LOOP));
      let worst = 0, wi = -1;
      if (a.length !== b.length) return { n: a.length, worst: Infinity, wi: -1 };
      for (let i = 0; i < a.length; i++) { const e = Math.abs(a[i] - b[i]); if (e > worst) { worst = e; wi = i; } }
      return { n: a.length, worst: worst, wi: wi };
    }
    // ⭐ R29：**逐剧本**复核接缝。三套 DH/YH/CH 各自的首末拍、各自的熄灯窗、各自的 grabT，
    //   闭环是**每套戏自己的承诺** —— 只测 V0 等于给 V1/V2 开了空白支票，
    //   而换戏发生在跑动的画面里（T28(a) 的轮换），一旦哪套开了缝就是每 6 圈闪一次。
    const per = [];
    for (let vi = 0; vi < VARS.length; vi++) per.push(withVariant(vi, seam));
    const worst = per.reduce((m, p) => (p.worst > m.worst ? p : m), per[0]);
    const saved = P.beamPeriod; P.beamPeriod = 11;      // 不整除 90 ⇒ 必须变红
    const negAll = [];
    for (let vi = 0; vi < VARS.length; vi++) negAll.push(withVariant(vi, () => {
      const c = fingerprint(sceneState(0)), e = fingerprint(sceneState(P.LOOP));
      let neg = 0; for (let i = 0; i < Math.min(c.length, e.length); i++) neg = Math.max(neg, Math.abs(c[i] - e[i]));
      return neg;
    }));
    P.beamPeriod = saved;
    const neg = Math.min.apply(null, negAll);           // ⛔ 取 max：三套里只要有一套咬不住就是判据空转
    out.push({ id: 'T4', name: '90 s 循环接缝闭合（逐字段 × 逐剧本 ' + per.length + ' 套）',
      pass: per.every((p) => p.worst < 1e-9) && neg > 0.5,
      val: per.map((p, i) => 'V' + i + ' ' + p.n + ' 字段 最大残差 ' + p.worst.toExponential(1)).join('；')
         + '（最差 ' + worst.worst.toExponential(1) + ' 在 V' + per.indexOf(worst)
         + (worst.wi >= 0 ? ' 字段 #' + worst.wi : '') + '）',
      neg: '负样本（每套剧本各自验一遍，取三套里**最小**的那个残差）：扫射周期 10→11（不整除 90）⇒ 残差 '
         + negAll.map((v) => v.toFixed(2)).join('/') });
  })();
  // T5 光束落点恒在相机前方 + 俯角 > 12°
  (function () {
    let minDep = 999, minAhead = 1e9, bad = 0, nFire = 0;
    for (let t = 0; t <= P.LOOP; t += 0.2) {
      const st = sceneState(t);
      // ⭐ R17 改口径：**只判开火帧**（fire ≥ 0.5）。掠过/揭示/绕后这三段两道热光是**全熄**的，
      //    而那正是机器绕到相机背后的时候 —— 熄灭的光束"落点"是纯几何外推，判它"必须在相机前方"
      //    等于要求一个不存在的东西待在你看得见的地方（实测 minAhead = −49 m，全部来自熄灯帧）。
      //    ⛔ 这是把判据限定在它真正描述的对象上，不是放宽：开火帧一条不减，另加 nFire ≥ 100 反空判。
      if (st.fire < 0.5) continue;
      nFire++;
      for (const bm of st.beams) {
        minDep = Math.min(minDep, bm.depression);
        const A = toCam(bm.hx, bm.hz, st.yaw).along;   // ⚠️ 相机系纵深，⛔ 世界 z（转身后可为负）
        minAhead = Math.min(minAhead, A); if (A <= 2) bad++;
      }
    }
    // 负样本：把 fireEnv 整个拆掉（fireT0 推到 LOOP 之外 ⇒ off ≡ 0 ⇒ fire ≡ 1；fireNear=0 关掉近距衰减）
    //   ⇒ 绕后段的光束"复活"，落点立刻掉到相机背后 ⇒ bad > 0。走的是真实代码路径，⛔ 不是改判据。
    const svT0 = P.fireT0, svT1 = P.fireT1, svN = P.fireNear;
    P.fireT0 = P.LOOP + 10; P.fireT1 = P.LOOP + 20; P.fireNear = 0;
    let negBad = 0, negAhead = 1e9, negN = 0;
    for (let t = 0; t <= P.LOOP; t += 0.2) {
      const st = sceneState(t);
      if (st.fire < 0.5) continue;
      negN++;
      for (const bm of st.beams) {
        const A = toCam(bm.hx, bm.hz, st.yaw).along;
        negAhead = Math.min(negAhead, A); if (A <= 2) negBad++;
      }
    }
    P.fireT0 = svT0; P.fireT1 = svT1; P.fireNear = svN;
    const neg = Math.atan2(-P.bodyY, 90) * 180 / Math.PI;
    out.push({ id: 'T5', name: '光束落点恒在相机前方 + 俯角 > 12°（仅开火帧）',
      pass: bad === 0 && minDep > 12 && nFire >= 100 && negBad > 0,
      val: '开火帧 ' + nFire + ' 个（≥100 反空判），最小俯角 ' + minDep.toFixed(1) + '°，最近落点相机系纵深 '
         + minAhead.toFixed(1) + ' m（相机前方）',
      neg: '负样本：拆掉 fireEnv（掠过/绕后段光束复活）⇒ ' + negBad + ' 个落点掉到相机背后，最近 '
         + negAhead.toFixed(1) + ' m；俯角符号写反 ⇒ ' + neg.toFixed(1) + '°' });
  })();
  // T6 流动雾条水平严格周期（横向重复 blit 要无缝）
  (function () {
    const A = fogStrips.A, B = fogStrips.B;
    const seam = Math.max(A._seam, B._seam), neg = Math.min(A._seamBad, B._seamBad);
    const step = Math.max(A._step, B._step), stepBad = Math.min(A._stepBad, B._stepBad);
    out.push({ id: 'T6', name: '流动雾条水平严格周期（横滚无缝）',
      pass: seam < 1e-12 && neg > 0.02 && step <= 1 + 1e-6 && stepBad > 2,
      val: 'x=0 与 x=1 逐行最大差 ' + seam.toExponential(2) + '（归一化 alpha），接缝/内部最大列差比 ' + step.toFixed(3),
      neg: '负样本：格频改 cells+0.37（周期不整除）⇒ 边缘差 ' + neg.toFixed(3) +
           '、列差比 ' + stepBad.toFixed(2) + '（既有 ProceduralTexture.Id.FOG 是全屏纹理，无此周期性 ⇒ 只能自烘，§五）' });
  })();
  // T7 游走段主体可见性闸门：机器"够清楚"的每一帧，机身中心与**机顶**都必须落在视口内
  //     ⛔ 抓的真实事故：机器在雾里明明该看得见，整台却旋出画面 / 旋到相机背后（pr 剔除 along<0.5）
  //        ⇒ 连续十几秒画面里什么都没有。第一版 T1–T6 全绿却把这条放过去了 ——
  //        观感类不变量必须有专属闸门，不能靠其他测试兜。
  (function () {
    const inFrame = (st) => {
      hz = H * P.horizonK + st.tilt;                       // 与 render() 同一处落地，⛔ 各算各的
      const bc = bodyFrame(0, 0.5, st.bodyY, st.psi, st.d, st.mx);   // 机身中心的世界系坐标
      const c = pr(bc.x, bc.y, bc.z, st.yaw);
      const tp = pr(bc.x, bc.y + (topY() - P.bodyY), bc.z, st.yaw);  // 机顶，与仰角公式同一口径
      return !!c && !!tp && Math.abs(c.X - cx) <= W * 0.5
        && c.Y >= -H * 0.15 && c.Y <= H * 1.15 && tp.Y >= 0;
    };
    /** ⭐ R17 范围收紧到**游走段**（编舞段 escEnv ≥ 0.5 整体移出判据），这不是放宽而是分工：
     *  掠过 / 揭示 / 绕后这三段"出画"是**设计**而不是缺陷 —— 12 m 贴身掠过时 34 m 高的整机
     *  投影 1.15 屏（必须裁），绕后段整机在相机背后（必须剔除）。那三段由 **T18** 用各自口径判：
     *    掠过 = 真距 ∈ [9,16] m **且** 裁屏量 ≥ 1 屏；揭示 = 居中连续 ≥ 1 s 且真距 ∈ [25,45] m；
     *    绕后 = **每一帧都必须看不见**，且归因只能是 剔除 / 出画 / 浓雾 三条合法理由之一。
     *  留在本闸门的游走段仍是全片主体（约 40 s），口径原样不动。
     *  ⚠️ 对比度闸门保留：雾里本来就不该看得见，出画不计。 */
    const judged = (st) => contrastAt(st.dist, st.D0) >= 0.05 && escEnv(st.G) < 0.5;
    let bad = 0, n = 0;
    for (let t = 0; t <= P.LOOP; t += 0.1) {
      const st = sceneState(t);
      if (!judged(st)) continue;
      n++; if (!inFrame(st)) bad++;
    }
    const savedK = P.wK;
    let negK = 0, nNeg = 0;
    P.wK = 4;                                       // 游走幅值 ×4 ⇒ 机器横出轨
    for (let t = 0; t <= P.LOOP; t += 0.1) {
      const st = sceneState(t);
      if (!judged(st)) continue;
      nNeg++; if (!inFrame(st)) negK++;
    }
    P.wK = savedK;
    hz = H * P.horizonK;                            // inFrame 写过的全局 hz 必须复位
    out.push({ id: 'T7', name: '游走段主体可见性闸门（对比度≥5% 的帧机身+机顶必须在画面内）',
      pass: bad === 0 && n >= 100 && negK > 30,
      val: '游走段应可见 ' + n + ' 帧（≥100 反空判），出画 ' + bad + ' 帧',
      neg: '负样本：wK 1→4（游走幅值 ×4）⇒ 同判据 ' + nNeg + ' 帧里出画 ' + negK + ' 帧（'
         + (negK / 10).toFixed(1) + ' s）机器横出轨。'
         + '⛔ R17 退役两条负样本，实测各 **0 帧** = 结构上死判据，留着会把闸门一起带空：'
         + '① tiltMax=0 —— 游走段真实最近距离 104.6 m（t=48.7 s），机顶在那个距离从不顶出画面，'
         + '仰角从来不是这里的承重项（贴近段的 tilt 改由 T18 判）；'
         + '② yawAmp=150 —— 判据区 t ≤ 54 s 的 YH 前三拍恒 0，yaw 恒 0，甩镜根本不参与。' });
  })();
  // T8 建筑带尺度闸门：§七 的两条判据必须**在代码里成立**，⛔ 只写在注释里当装饰
  //     · 中景「整栋入画」h·PPM·s ≤ hz（用未加仰角的 hz，仰角只会更宽松 ⇒ 保守）
  //     · 近景「最多出画 15%」h·PPM·s ≤ 1.15H（近景带在 1.7 m 眼高下不可能整栋入画）
  //     负样本 = 第一版的 mid 74 / near 88，两条都必须变红。
  (function () {
    const cap = (cfg, lim) => cfg.hHi * PPM * (P.fz / (P.fz + cfg.zMin)) - lim;
    const midOver = cap(BAND.mid, hzBase()), nearOver = cap(BAND.near, H * 1.15);
    const savedM = BAND.mid.hHi, savedN = BAND.near.hHi;
    BAND.mid.hHi = 74; BAND.near.hHi = 88;                       // 第一版的拍脑袋值
    const negM = cap(BAND.mid, hzBase()), negN = cap(BAND.near, H * 1.15);
    BAND.mid.hHi = savedM; BAND.near.hHi = savedN;
    out.push({ id: 'T8', name: '建筑带尺度闸门（中景整栋入画 / 近景出画 ≤15%）',
      pass: midOver <= 0 && nearOver <= 0 && negM > 0 && negN > 0,
      val: '中景投影 ' + (cap(BAND.mid, hzBase()) + hzBase()).toFixed(0) + ' px ≤ hz ' + hzBase().toFixed(0)
         + '（余量 ' + (-midOver).toFixed(0) + '）/ 近景 ' + (cap(BAND.near, H * 1.15) + H * 1.15).toFixed(0)
         + ' px ≤ 1.15H ' + (H * 1.15).toFixed(0) + '（余量 ' + (-nearOver).toFixed(0) + '）',
      neg: '负样本（第一版 74/88 m）：中景超 ' + negM.toFixed(0) + ' px、近景超 ' + negN.toFixed(0) + ' px' });
  })();
  // T9 两道光分离闸门：需求点 2 是「射出**两道**光照」，⛔ 一道粗光
  //     判据：任意帧两落点横向间距 > 两个地面半宽之和（同深度 ⇒ 米和像素同序，用米即可）。
  //     负样本 = 第一版参数（gap 0.6 m + 发散系数 0.012），最近位两个楔子完全重叠。
  (function () {
    let got = 1e9;
    for (let t = 0; t <= P.LOOP; t += 0.2) {

        if (k > r.maxPerFrame) r.maxPerFrame = k;
      }
      for (const t of [0, P.LOOP]) { const st = sceneState(t); for (const L of st.legs) if (L.imp > r.seam) r.seam = L.imp; }
      return r;
    };
    // 包络端点：触地**前一刻** / 触地**后一瞬** / 窗末。三个都必须贴 0，
    // 中间那个尤其关键 —— 它是"冲击是不是阶跃起波"的判据。
    const envCheck = () => ({ at: footImp(mod(IMPACT.phase - 1e-6, 1)),
                              just: footImp(mod(IMPACT.phase + 1e-6, 1)),
                              end: footImp(mod(IMPACT.phase + IMPACT.win - 1e-9, 1)) });
    const why = (pu, dr, ev) => {
      const bad = [], steps = Math.round(GTOT / P.STRIDE);
      if (dr.on === 0) bad.push('d 全圈 ' + (N + 1) + ' 帧里冲击环**一次都没落笔**（强度 '
        + P.impactA.toFixed(2) + '、峰值 imp ' + pu.impHi.toFixed(3) + '）⇒ 包络存在但画面没付代价，本闸门无对象');
      if (pu.swing > 0) bad.push('a 有 ' + pu.swing + ' 次冲击落在**摆动相**的脚上 ⇒ 雾被还抬着的脚排开');
      if (pu.maxPerFrame > 1) bad.push('b 同帧最多 ' + pu.maxPerFrame + ' 条冲击同时开 ⇒ 这一层一次吃掉 '
        + pu.maxPerFrame + ' 个图元，且三个落点糊成一片');
      if (pu.events !== 3 * steps) bad.push('c 一轮触发 ' + pu.events + ' 次 ≠ 3 腿 × ' + steps
        + ' 步 ⇒ 冲击频率不是由步频导出（漏触发，或自己带了个频率）');
      if (!(dr.rxLo >= 8 && dr.rxHi <= W * 0.22)) bad.push('d 环半径 ' + dr.rxLo.toFixed(1) + '→'
        + dr.rxHi.toFixed(1) + ' px 越出 [8, ' + (W * 0.22).toFixed(0) + '] ⇒ 要么看不见、要么横扫小半屏');
      // ⚠️ 判 **峰值** α，⛔ 判最小值：包络是快起慢落，尾巴必然一路衰减到绘制自己的
      //    0.01 剔除阈为止 —— 拿 0.02 去卡最小值等于跟剔除线打架（两套口径）。
      // ⚠️ 下沿 0.25 是**图判出来的**，不是拍的：0.30 强度（峰值 α 0.24）时闸门全绿，
      //    画面上却只剩"脚底一块说不清的灰"（r26a）—— 旧的 0.10 下沿放行了一整个
      //    看不见的默认值。R25 的 CTM 事故是同一类盲区（记了 ops、一个像素没落笔），
      //    下沿收紧到肉眼阈才补得上。
      if (!(dr.aHi >= 0.25 && dr.aHi <= 0.60)) bad.push('d 环峰值 α ' + dr.aHi.toFixed(3)
        + ' 越出 [0.25, 0.60] ⇒ 要么整圈读不出来、要么一枚实心白饼');
      if (!(ev.at < 1e-6 && ev.just < 0.05 && ev.end < 0.05)) bad.push('e 包络端点 '
        + ev.at.toFixed(3) + ' / ' + ev.just.toFixed(3) + ' / ' + ev.end.toFixed(3)
        + '（触地前 / 触地后一瞬 / 窗末）⇒ 起跳阶跃或窗尾被截断，换相那一帧会闪一下');
      if (pu.seam > 0.004) bad.push('e t=0 与 t=LOOP 两侧仍有 imp=' + pu.seam.toFixed(3)
        + ' 的冲击在画 ⇒ 跨圈残留，接缝处凭空多出一圈');
      return bad;
    };
    const pu0 = scanPure(), dr0 = scanDraw(), ev0 = envCheck(), pw = why(pu0, dr0, ev0);
    const k1 = IMPACT.win, k2 = IMPACT.phase, k3 = P.impactA, k4 = IMPACT.rOut, k5 = IMPACT.attack;
    IMPACT.win = 0.5;     const aw = why(scanPure(), dr0, envCheck());      IMPACT.win = k1;
    IMPACT.phase = 0;     const bw = why(scanPure(), dr0, envCheck());      IMPACT.phase = k2;
    P.impactA = 0;        const cw = why(pu0, scanDraw(), ev0);             P.impactA = k3;
    // C′ 是这条闸门的**正身**：强度非零 ⇒ 环照样落笔、ops 照样记账，只有 α 掉到肉眼阈下。
    //      ⛔ 拿 C（强度→0）当"看不见"的负样本 —— 那判的是"有没有这一层"，不是"看不看得见"。
    P.impactA = 0.06;     const cg = why(pu0, scanDraw(), ev0);             P.impactA = k3;
    P.impactA = 1.2;      const dw = why(pu0, scanDraw(), ev0);             P.impactA = k3;
    IMPACT.rOut = 40;     const ew = why(pu0, scanDraw(), ev0);             IMPACT.rOut = k4;
    IMPACT.attack = 1e-9; const fw = why(pu0, dr0, envCheck());             IMPACT.attack = k5;
    const steps = Math.round(GTOT / P.STRIDE);
    out.push({ id: 'T21', name: '落地冲击压雾：只在站立相、同帧一条、频率由步频导出、有界（R22）',
      pass: pw.length === 0 && pu0.frames > 0 && dr0.on > 0
            && aw.length > 0 && bw.length > 0 && cw.length > 0 && cg.length > 0 && dw.length > 0
            && ew.length > 0 && fw.length > 0,
      val: '一轮触发 ' + pu0.events + ' 次 = 3 腿 × ' + steps + ' 步（GTOT ' + GTOT
         + ' m ÷ STRIDE ' + P.STRIDE + ' m）⇒ 冲击频率完全是步频的导出量，⛔ 自带周期；'
         + '同帧最多 ' + pu0.maxPerFrame + ' 条（win ' + IMPACT.win.toFixed(2)
         + ' 步幅 < 1/3）；有冲击的帧 ' + pu0.frames + ' / ' + (N + 1) + '（'
         + (100 * pu0.frames / (N + 1)).toFixed(1) + '%）、落笔 ' + dr0.on + ' 条（被剔 '
         + dr0.off + ' 条）；落笔环半径 ' + dr0.rxLo.toFixed(1) + '→' + dr0.rxHi.toFixed(1)
         + ' px ∈ [8, ' + (W * 0.22).toFixed(0) + ']、α ' + dr0.aLo.toFixed(3) + '→'
         + dr0.aHi.toFixed(3) + '（峰值判 [0.25, 0.60]，下沿只到绘制自身的 0.01 剔除阈为止）；包络端点 ' + ev0.at.toFixed(3) + '/'
         + ev0.just.toFixed(3) + '/' + ev0.end.toFixed(3) + '、接缝两侧最大 imp '
         + pu0.seam.toFixed(4) + '；摆动相触发次数 ' + pu0.swing + '（应为 0）',
      neg: '负样本：A win→0.5 ⇒ ' + (aw.join('；') || '⚠️ 假负样本')
         + '；B 触地相位→0（摆动相）⇒ ' + (bw.join('；') || '⚠️ 假负样本')
         + '；C 强度→0 ⇒ ' + (cw.join('；') || '⚠️ 假负样本')
         + '；D 强度→1.2 ⇒ ' + (dw.join('；') || '⚠️ 假负样本')
         + '；E rOut→40 m ⇒ ' + (ew.join('；') || '⚠️ 假负样本')
         + '；F attack→0（阶跃起波）⇒ ' + (fw.join('；') || '⚠️ 假负样本') });
  })();

  // ══ T22 人群纪元闸门（R21）══════════════════════════════════════════════════
  //    R21 把"每圈同一批人"改成"每回收一次换一个人"，换来的是**换脸时机**这个新风险：
  //      (a) 换人只发生在看不见的地方 —— 圈内每次轮次跳变那一刻的渲染 α 必须贴 0，
  //          且必须落在 crowdWindow 的淡入/淡出窗内；**跨圈接缝一个坑位都不许变**
  //          （C 在缝上回退整整一个 span，lapK 的符号就是为抵掉这一跳而定的，见 CEPOCH）
  //      (b) 跨圈**确实**换了 —— 只写公式不测就等于没换：逐坑位比 lap0/1/2 的侧向与姿态
  //      (c) 换种子只换侧向与姿态，⛔ 换纵向位置 —— z 逐位相同（T4 的接缝闭合、T19 的
  //          回收计数都读 z，z 一动整套周期判据就跟着重洗，⛔ 那是"顺手改了剧本"）
  //      (d) 受害人锚点恒定 —— 他的 (x, z, kind) 是抓取几何的一部分，与缆须长度对死
  //    ⚠️ 判据全部读 **crowdAt 导出的那一份**（p.w / p.a / p.z），⛔ 在闸门里重推 floor 式子。
  //    ⚠️ 采样 1/24 s：1/12 时带端那一帧能落到 z=23.5 ⇒ α 0.021，贴着 0.02 的"被看见"阈
  //       （那是**网格对齐**造成的假读数，⛔ 拿它当判据）；1/24 实测最大 0.0049，余量 4×。
  (() => {
    const CD = 1 / 24, NC = Math.round(P.LOOP / CD);
    // 圈内扫描：**整趟都在 lapN=0 上**（播放器的接缝帧是 t=CD 而非 t=LOOP，⛔ 在这里拨圈数）
    const scanLap = () => {
      const r = { ch: 0, hiA: 0, mid: 0, slots: 0, maxFlip: 0 };
      const prevW = new Map(), flip = new Map();
      for (let i = 0; i < NC; i++) {
        const st = sceneState(i * CD);
        for (const p of st.crowd) {
          if (p.victim) continue;
          if (prevW.has(p.i)) {
            const dw = p.w - prevW.get(p.i);
            if (dw !== 0) {
              r.ch++;
              flip.set(p.i, (flip.get(p.i) || 0) + 1);
              if (p.a > r.hiA) r.hiA = p.a;
              const inWin = p.z <= CBAND.zMin + CBAND.fin
                         || p.z >= CBAND.zMin + CBAND.span - CBAND.fout;
              if (!inWin) r.mid++;
            }
          }
          prevW.set(p.i, p.w);
        }
      }
      r.slots = flip.size;
      for (const v of flip.values()) if (v > r.maxFlip) r.maxFlip = v;
      return r;
    };
    // 接缝专检：第 k 圈末帧 → 第 k+1 圈首帧是**同一相位**，轮次必须逐坑位不变。
    const seamOnly = (lapA, lapB) => {
      lapN = lapA; const a = sceneState(P.LOOP - CD);
      lapN = lapB; const b = sceneState(CD);
      lapN = 0;
      const ma = new Map(); for (const p of a.crowd) ma.set(p.i, p);
      let n = 0, hiA = 0;
      for (const p of b.crowd) {
        if (p.victim) continue;
        const q = ma.get(p.i); if (!q || q.w === p.w) continue;
        n++; const m = Math.max(q.a, p.a); if (m > hiA) hiA = m;
      }
      return { n: n, a: hiA };
    };
    // 跨圈换人：同一相位 t 上把圈数拨成 0/1/2，逐坑位比侧向（x 的符号）与姿态
    const identAcross = (t, laps) => {
      const sn = laps.map(L => { lapN = L; const o = sceneState(t).crowd.filter(p => !p.victim); lapN = 0; return o; });
      const n = sn[0].length; let ch = 0, side = 0, kind = 0;
      for (let i = 0; i < n; i++) {
        let sd = false, kd = false;
        for (let j = 1; j < sn.length; j++) {
          if (sn[j][i].x * sn[0][i].x < 0) sd = true;
          if (sn[j][i].kind !== sn[0][i].kind) kd = true;
        }
        if (sd || kd) ch++;
        if (sd) side++; if (kd) kind++;
      }
      return { n: n, ch: ch, side: side, kind: kind };
    };
    // z 指纹：换种子只该换"谁站在这儿"，⛔ 换"这个人跑到哪一格"
    const zfp = (seed) => {
      const saved = P.crowdSeed0; P.crowdSeed0 = seed;
      let o = '';
      for (let i = 0; i < 30; i++) { const st = sceneState(i * P.LOOP / 30); for (const p of st.crowd) o += p.z.toFixed(9) + ','; }
      P.crowdSeed0 = saved; return o;
    };
    const SEEDS = [1, 2, 7, 42, 999];
    // 差值取**全部种子两两之间**的最大（只比前两颗会把 1.7 m 报成"最大差"，⛔ 低估违例）
    const maxZDiff = () => {
      const f = SEEDS.map(zfp);
      let m = 0;
      for (let a = 0; a < f.length; a++) {
        const fa = f[a].split(',');
        for (let b = a + 1; b < f.length; b++) {
          const fb = f[b].split(',');
          for (let i = 0; i < fa.length; i++) { const v = Math.abs(+fa[i] - +fb[i]); if (v > m) m = v; }
        }
      }
      return { same: f.every(x => x === f[0]), d: m };
    };
    // 受害人锚点：跨 4 圈 × 2 个种子的 (x, z, kind) 必须逐字节同一份
    const vfp = (seed) => {
      const saved = P.crowdSeed0; P.crowdSeed0 = seed;
      let o = '';
      for (const L of [0, 1, 2, 3]) { lapN = L; const p = sceneState(48.5).crowd[0]; o += p.x.toFixed(4) + '/' + p.z.toFixed(4) + '/' + p.kind + '|'; }
      lapN = 0; P.crowdSeed0 = saved; return o;
    };
    const why = (lap, seam, idc, zf, vicA, vicB) => {
      const bad = [];
      if (lap.ch === 0) bad.push('a 一圈 ' + NC + ' 帧里轮次**一次都没跳过**（换人逻辑没对象，本闸门空转）');
      if (seam.n > 0) bad.push('a 跨圈接缝有 ' + seam.n + ' 个坑位换了轮次、最亮 α=' + seam.a.toFixed(4)
        + ' ⇒ 人在画面中段当场换脸（C 在缝上回退一个 span，lapK 没能抵掉）');
      if (!(lap.hiA < 0.02)) bad.push('a 圈内换人那一刻最亮 α=' + lap.hiA.toFixed(4) + ' ≥ 0.02（与 T19(e) 同一条"被看见"阈）'
        + ' ⇒ 换人发生在看得见的地方');
      if (lap.mid > 0) bad.push('a 有 ' + lap.mid + ' 次换人落在淡入/淡出窗**之外**（z 不在带端）⇒ 位置对上了但人换了');
      if (!(idc.ch >= Math.ceil(idc.n * 0.6) && idc.ch > 0)) bad.push('b 三圈之间只有 ' + idc.ch + '/' + idc.n
        + ' 个坑位换过人 ⇒ 纪元没进种子，第二圈还是同一批人');
      if (!(idc.side > 0 && idc.kind > 0)) bad.push('b 换过的坑位里 side 变 ' + idc.side + '、kind 变 ' + idc.kind
        + ' ⇒ 只换了一半（要么人人同侧要么人人同姿）');
      if (!zf.same) bad.push('c 换种子后 z 指纹不一致（最大差 ' + zf.d.toFixed(2) + ' m）⇒ 纪元动到了纵向位置，T4/T19 的周期口径跟着变');
      if (vicA !== vicB) bad.push('d 受害人锚点随种子漂移 ⇒ 抓取几何（grabDz/grabDx 与缆须长度）对不上');
      return bad;
    };
    const lap0 = scanLap(), seam0 = seamOnly(0, 1), id0 = identAcross(30, [0, 1, 2]), zf0 = maxZDiff();
    const v1 = vfp(1), v7 = vfp(7), pw = why(lap0, seam0, id0, zf0, v1, v7);
    // 负样本 A/A'：lapK 的两个错号（0 = 不认圈 ⇒ 接缝换脸 + 同一批人；−1 = 反号 ⇒ 缝上变 ±2）
    const savedK = CEPOCH.lapK;
    CEPOCH.lapK = 0;  const aw = why(scanLap(), seamOnly(0, 1), identAcross(30, [0, 1, 2]), zf0, v1, v7);
    CEPOCH.lapK = -1; const bw = why(scanLap(), seamOnly(0, 1), id0, zf0, v1, v7);
    CEPOCH.lapK = savedK;
    // 负样本 C：把种子混进 z0；负样本 D：让受害人跟着纪元换
    CEPOCH.zSeedK = 1; const zfc = maxZDiff(); CEPOCH.zSeedK = 0;
    const cw = why(lap0, seam0, id0, zfc, v1, v7);
    CEPOCH.victimK = 1; const vd = vfp(1), ve = vfp(7); CEPOCH.victimK = 0;
    const dw = why(lap0, seam0, id0, zf0, vd, ve);
    out.push({ id: 'T22', name: '人群纪元闸门（换人只在带端与跨圈、跨圈确实换、⛔ 动 z、受害人锚点恒定）（R21）',
      pass: pw.length === 0 && lap0.ch > 0 && aw.length > 0 && bw.length > 0 && cw.length > 0 && dw.length > 0,
      val: '一圈 ' + NC + ' 帧（1/24 s）内轮次跳变 ' + lap0.ch + ' 次、覆盖 ' + lap0.slots
         + ' 个坑位（单坑位最多 ' + lap0.maxFlip + ' 次 —— d 非单调，人在带端来回跨格是**预期行为**）；'
         + '跳变那一刻最亮 α=' + lap0.hiA.toFixed(4) + ' < 0.02、窗内（z 落在淡入/淡出区）'
         + (lap0.mid === 0 ? '全部命中' : '违例 ' + lap0.mid + ' 次') + '；跨圈接缝 ' + seam0.n + ' 个坑位换轮次、最亮 α='
         + seam0.a.toFixed(4) + '（应为 0 个）；'
         + 'lap0/1/2 同一 t=30 s 逐坑位比对：' + id0.ch + '/' + id0.n + ' 个换过人（侧向 ' + id0.side + '、姿态 ' + id0.kind + '）；'
         + SEEDS.length + ' 个种子的 z 指纹逐位相同（最大差 ' + zf0.d.toFixed(6) + ' m）；'
         + '受害人锚点跨 4 圈 × 2 种子 = ' + (v1 === v7 ? '同一份' : '已漂移') + '（x=' + v1.split('|')[0].split('/')[0] + '）',
      neg: '负样本：A lapK→0（种子不认圈）⇒ ' + (aw.join('；') || '⚠️ 假负样本')
         + '；A′ lapK→−1（反号，缝上变 ±2）⇒ ' + (bw.join('；') || '⚠️ 假负样本')
         + '；C 种子混进 z0 ⇒ ' + (cw.join('；') || '⚠️ 假负样本')
         + '；D 受害人跟纪元换 ⇒ ' + (dw.join('；') || '⚠️ 假负样本') });
  })();

  // ══ T23 落点这侧只剩贴地亮斑（R23 建、R31 改造）══════════════════════════════
  //    判读轮 7 删了发射口白球，判读轮 8 一句「光柱前端那团光还在啊」—— 还活着的是**落点上方
  //    那颗悬空尘球**：半径 = 亮斑的 1.75 倍、中心抬起 1.15 倍亮斑半径，加色画在雾里比光柱本身
  //    还显眼（r30_H_光柱前端 实拍）。整层撤下（DUST.on=0，强度滑杆一起删），所有者点名要留的
  //    **地面亮斑**与它的烫内圈原样不动。于是本闸门从"扬尘画得对不对"改成"落点这侧还剩什么"：
  //      (a) 三档 × 全圈：类别「命中扬尘」落笔 **0 次**（那颗球真没了，⛔ 只是换了个名字）。
  //      (b) 剩下的那层是**贴地的斑**不是团：绘制函数记下的竖向/横向跨度比 ≤ 0.45（圆 = 1）。
  //    ⛔ 与 T29 重复：T29(b) 判"柱体与亮斑逐帧成对"（那一层**在不在**），本闸门判"落点上方干不
  //    干净 + 那一层**长什么样**"。两条各管一头，改一处不会同时挪两处。
  //    ⚠️ 负样本必须咬住**自己那条标号**（R30 的教训：一条假红能同时糊弄三条"非空"判据）。
  (() => {
    const DT = 1 / 6, N = Math.round(P.LOOP / DT);
    const TIERS = ['LOW', 'MED', 'HIGH'];
    const has = (w, tag) => w.some((x) => x.slice(0, tag.length + 1) === tag + ' ');
    const run = (tier) => {
      const r = { dust: 0, dustOps: 0, beamMax: 0, poolN: 0, sqMax: 0,
                  rrLo: 1e9, rrHi: 0, tPeak: 0, n: 0 };
      for (let i = 0; i <= N; i++) {
        const t = i * DT;
        const c = catsAt(t, tier);                    // render() 顺带把 BEAM_REC 填成**这一帧**的
        const nd = catOps(c, '命中扬尘'), nb = catOps(c, '光束柱体'), np = catOps(c, '地面落点亮斑');
        if (nd) { r.dust++; r.dustOps += nd; }
        if (nb > r.beamMax) { r.beamMax = nb; r.tPeak = t; }
        if (np) r.poolN++;
        for (const x of BEAM_REC) {
          if (!x.poolOn) continue;
          r.n++;
          if (x.sq > r.sqMax) r.sqMax = x.sq;
          if (x.rr < r.rrLo) r.rrLo = x.rr; if (x.rr > r.rrHi) r.rrHi = x.rr;
        }
      }
      return r;
    };
    const why = (r) => {
      const bad = [];
      if (r.beamMax === 0) bad.push('a/b 一圈 ' + (N + 1) + ' 帧一道光柱都没落笔 ⇒ 判据无对象');
      if (r.dust > 0) bad.push('a ' + r.dust + '/' + (N + 1) + ' 帧在落点上方落笔命中扬尘（共 '
        + r.dustOps + ' 条）⇒ 光柱前端顶着一团光');
      if (r.poolN === 0) bad.push('b 全圈亮斑一次没落笔 ⇒ (b) 是恒真式（没有对象可量）');
      if (!(r.sqMax <= 0.45)) bad.push('b 亮斑竖向/横向跨度比最大 ' + r.sqMax.toFixed(2)
        + ' > 0.45 ⇒ 落点那层不是贴地的斑，是悬在落点上的圆团');
      return bad;
    };
    const R = {}; for (const k of TIERS) R[k] = run(k);
    const w0 = TIERS.map((k) => why(R[k])).reduce((a, b) => a.concat(b), []);
    // 负样本 A：把尘球补回**真代码路径**（DUST.on=1），三档各自峰值帧必须抓到落笔。
    //   ⚠️ LOW 档必须**同时**把 tierK 置 0：那里的"0 次"本来有两道成因（层级关了 / 档位跳了），
    //   只开 on 不动 tierK，LOW 那条永远抓不到 ⇒ (a) 在 LOW 就是恒真式（首轮实测正是这样红的）。
    const nA = [], nAd = [];
    for (const k of TIERS) {
      const tk = DUST.tierK; DUST.on = 1; DUST.tierK = 0;
      const c = catsAt(R[k].tPeak, k); DUST.on = 0; DUST.tierK = tk;
      const nd = catOps(c, '命中扬尘');
      if (nd === 0) nA.push(k); nAd.push(k + ' ' + nd + ' 条');
    }
    // 负样本 B：亮斑从"贴地的斑"变回"圆团"（sq→1），必须只让 (b) 红
    const sq0 = POOL.sq; POOL.sq = 1;
    const wB = why(run('MED')); POOL.sq = sq0;
    out.push({ id: 'T23', name: '落点只剩贴地亮斑：悬空尘球 0 落笔 + 亮斑跨度比 ≤0.45（R31 改造 R23）',
      pass: w0.length === 0 && nA.length === 0 && has(wB, 'b') && !has(wB, 'a'),
      val: '三档 × 全圈 ' + (N + 1) + ' 帧（1/6 s）：类别「命中扬尘」落笔 '
         + TIERS.map((k) => R[k].dust).join(' / ') + ' 次（判据 0）；亮斑落笔帧 '
         + TIERS.map((k) => R[k].poolN).join(' / ') + '，跨度比最大 ' + R.MED.sqMax.toFixed(2)
         + '（判据 ≤0.45）、半径 ' + R.MED.rrLo.toFixed(1) + '→' + R.MED.rrHi.toFixed(1)
         + ' px、一圈亮斑记录 ' + R.MED.n + ' 条；柱体峰值帧 t=' + R.MED.tPeak.toFixed(1) + ' s',
      neg: '负样本：A DUST.on=1 且 tierK=0（把悬空尘球补回真代码路径；LOW 档不一起放开 tierK 就永远抓不到）'
         + '在各档柱体峰值帧落笔 ' + nAd.join('；')
         + '（' + (nA.length ? '⚠️ ' + nA.join(',') + ' 档没抓到 ⇒ (a) 是恒真式' : '三档全 >0 ⇒ 正样本那条"0 次"是量出来的') + '）；'
         + 'B POOL.sq=1（亮斑变回圆团）⇒ ' + (wB.length ? wB.join('；').slice(0, 200) : '⚠️ 假负样本（判据空转）') });
  })();

  // ══ T30 发射口无亮帽（R31）════════════════════════════════════════════════════
  //    判读轮 7 删掉白球后所有者仍说"还在"：因为**柱体自己的峰值 α 就压在 stop 0**，而两道光的
  //    出处只隔 2.6 m ⇒ 两个满亮楔子并排，近处看照样是一盏枪口灯（r30_H_火星24 实拍）。
  //    现在柱体沿柱长**起亮爬升**：发射口只留 12% 的量、峰推到 12% 处、近端半宽 0.38→0.18 m。
  //    四条判据全部读 drawBeams 记进 BEAM_REC 的那一份（⛔ 闸门重推渐变 = 第二套口径）：
  //      (a) 起亮比 stop0/峰值 ≤ 0.25；(b) 峰位 ≥ 6% 柱长（⛔ 端点即峰，(a) 管比值、这条管位置）；
  //      (c) 近端半宽 ≤ 0.25 m；(d) 反作弊：一圈峰值 α 最大 ≥ 0.25。
  //    ⚠️ (d) **必须是绝对数**：柱体与亮斑的 α 同乘 st.beamI，任何比值判据都会跟着 P.beamI 一起降，
  //       抓不到"把整条光束调暗来让 (a) 过关"。0.25 的口径：现式子 0.62·beamI·colVis 在 beamI 峰
  //       （0.62×1.15）与最近位雾透（colVis 实测 ≈0.66）下的一圈最大 = **本闸门 val 里那个实测值**，
  //       阈值取它下面最近的格点 0.25，⛔ 把一次实测原样抄进判据（D24 的教训）。负样本 D 用
  //       beamI→0.4（一圈最大掉到 0.19）这种"看着不算离谱"的调暗，证明它咬得住的是真实退化而不是
  //       只抓荒谬值。
  //    ⚠️ 整段钉在 V0（withVariant(0)）：三套剧本开火窗不同，这里要印的是能写进方案文档的定数。
  (() => {
    const R = withVariant(0, () => {
      const DT = 1 / 6, N = Math.round(P.LOOP / DT);
      const run = (tier) => {
        const r = { n: 0, footMax: 0, peakAtMin: 1, nearMax: 0, aPeakMax: 0, frames: 0 };
        for (let i = 0; i <= N; i++) {
          const t = i * DT;
          catsAt(t, tier);
          let kk = 0;
          for (const x of BEAM_REC) {
            r.n++; kk++;
            if (x.footRatio > r.footMax) r.footMax = x.footRatio;
            if (x.peakAt < r.peakAtMin) r.peakAtMin = x.peakAt;
            if (x.nearM > r.nearMax) r.nearMax = x.nearM;
            if (x.aPeak > r.aPeakMax) r.aPeakMax = x.aPeak;
          }
          if (kk) r.frames++;
        }
        return r;
      };
      const why = (r) => {
        const bad = [];
        if (r.n === 0) bad.push('a/b/c/d 一圈 ' + (N + 1) + ' 帧没有一道柱体落笔 ⇒ 判据无对象');
        if (!(r.footMax <= 0.25)) bad.push('a 发射口/峰值 α 比 ' + r.footMax.toFixed(2)
          + ' > 0.25 ⇒ 柱体最亮的一档又压回喷口上（两个满亮楔子并成一团）');
        if (!(r.peakAtMin >= 0.06)) bad.push('b 峰值位置最靠前的那道光在柱长 '
          + (100 * r.peakAtMin).toFixed(0) + '% < 6% ⇒ 端点即峰值，爬升等于没写');
        if (!(r.nearMax <= 0.25)) bad.push('c 近端半宽 ' + r.nearMax.toFixed(2)
          + ' m > 0.25 m ⇒ 出射端是一个楔子口而不是一条细线');
        if (!(r.aPeakMax >= 0.25)) bad.push('d 一圈峰值 α 最大只有 ' + r.aPeakMax.toFixed(3)
          + ' < 0.25 ⇒ 靠调暗整条光束骗过 (a)（热光本身没了）');
        return bad;
      };
      const TIERS = ['LOW', 'MED', 'HIGH'];
      const R2 = {}; for (const k of TIERS) R2[k] = run(k);
      const w0 = TIERS.map((k) => why(R2[k])).reduce((a, b) => a.concat(b), []);
      const has = (w, tag) => w.some((x) => x.slice(0, tag.length + 1) === tag + ' ');
      const neg = (mut, restore, tag) => {
        mut(); const w = why(run('MED')); restore();
        return { w: w, ok: has(w, tag) };
      };
      const f0 = P.beamFoot, p0 = P.beamPeakAt, n0 = P.beamHalfNear, bi0 = P.beamI;
      const nA = neg(() => { P.beamFoot = 1; }, () => { P.beamFoot = f0; }, 'a');
      const nB = neg(() => { P.beamPeakAt = 0; }, () => { P.beamPeakAt = p0; }, 'b');
      const nC = neg(() => { P.beamHalfNear = 0.38; }, () => { P.beamHalfNear = n0; }, 'c');
      const nD = neg(() => { P.beamI = 0.4; }, () => { P.beamI = bi0; }, 'd');
      return { R2: R2, TIERS: TIERS, w0: w0, N: N, nA: nA, nB: nB, nC: nC, nD: nD };
    });
    const cut = (x) => (x.w.length ? x.w.join('；').slice(0, 200) : '⚠️ 假负样本（判据空转）');
    out.push({ id: 'T30', name: '发射口无亮帽：柱体起亮爬升 + 近端收窄 + 峰值不许调暗（R31）',
      pass: R.w0.length === 0 && R.nA.ok && R.nB.ok && R.nC.ok && R.nD.ok,
      val: '三档 × 全圈 ' + (R.N + 1) + ' 帧（1/6 s）、柱体记录 ' + R.R2.MED.n + ' 条：'
         + '起亮比 ' + R.R2.MED.footMax.toFixed(2) + '（判据 ≤0.25）、峰位 ≥ '
         + (100 * R.R2.MED.peakAtMin).toFixed(0) + '% 柱长（判据 ≥6%）、近端半宽 '
         + R.R2.MED.nearMax.toFixed(2) + ' m（判据 ≤0.25）、一圈峰值 α 最大 '
         + R.R2.MED.aPeakMax.toFixed(3) + '（判据 ≥0.25，⛔ 不许靠调暗骗过 (a)）',
      neg: '负样本：A beamFoot→1 ⇒ ' + cut(R.nA) + '；B beamPeakAt→0 ⇒ ' + cut(R.nB)
         + '；C beamHalfNear→0.38（旧值）⇒ ' + cut(R.nC) + '；D beamI→0.4（把整条光束调暗）⇒ ' + cut(R.nD) });
  })();

  // ══ T31 掠过段负压闸门（R25 · 所有者裁决「留」）════════════════════════════════
  //    这层原本是三十条里唯一"只能靠眼睛"的隔离项；裁决=留 ⇒ 按 §十四 的口径它就得有自己的判据，
  //    ⛔ 就这样移植进 Kotlin。六条判据全部读 drawFootWake 记进 WAKE_REC 的**那一份**（同脚、同尺度
  //    源、同一次落笔）—— ⛔ 闸门再投影一遍脚位就是第二套口径（T20 的纪律）。
  //      (a) 逐脚锚定：落笔点相对**自己那只脚**的偏移精确等于 k·side·rx（容差 0.5 px）。
  //          R25 第一版用三脚均值锚 ⇒ 贴近那一瞬两腿跨在相机两侧、均值落在两脚之间的空地上，
  //          画面读成"地上一块说不清的灰"（r26e/f 实拍）—— 负样本 A 就是把锚插回均值。
  //      (b) 横向速度 = 脚速：锚点位移（剥掉尺度项后的 uc = X − k·side·rx）与脚位移之比 ∈ [0.7, 1.3]，
  //          只在 |Δfx| ≥ 2 px 的帧对采样（脚近乎纯纵向时比值是噪声，⛔ 拿它当证据）；跨断档不配对。
  //          ⚠️ ⛔ 用 ΔX/Δfx 原式判 —— rx 本身随景深变，ΔX = Δfx + k·side·Δrx 是**恒等式**，
  //             比值天然偏离 1，那是合法的尺度项不是"脊在滑"（第一版就在这条上假红过）。
  //      (c) 只在贴身段：落笔帧占比 ≤ 60%、最远落笔 ≤ d0、最近落笔 ≤ d1+1 m（d1≈最近位 ⇒
  //          最强的一记正好压在掠过那一瞬，⛔ 整圈常驻一条领圈）。
  //      (d) α 有界且**钳位真在生效**：落笔峰值 α ∈ [0.25, 0.32]，且钳位前的原始值 wakeA·wk
  //          一圈最大 > 0.30。⚠️ ⛔ 判 `a ≤ WAKE.cap` —— 那个 clamp 就写在式子里，判它是恒真式；
  //          能判的只有"钳位有没有被真的触发"和"画面上到底多亮"（下沿 0.25 抄 T21 的肉眼阈口径）。
  //      (e) LOW 档 0 次落笔（与 R23 同一档纪律）。⚠️ WAKE_REC 在 render() 顶部清、且落在
  //          drawFootWake 自己的档早退**之前** ⇒ LOW 的 0 是"真没落笔"而不是"没采到"，负样本 F 证它咬得住。
  //      (f) 三脚齐备 + 单帧 ≤ 9 处（3 脚 ×(2 脊 + 1 通道)）：同帧重复 (脚,侧) = 画面不变而图元翻倍。
  //    ⚠️ 整段钉在 V0（withVariant(0)）：V2 最近位 73.6 m > d0，负压本来就不该在那套戏里出现，
  //       拿它跑正样本只会得到"判据无对象"。三套戏各自的贴身段由 T27 管。
  (() => {
    const R = withVariant(0, () => {
      const DT = 1 / 6, N = Math.round(P.LOOP / DT);
      const DL = 1 / 12, NL = Math.round(P.LOOP / DL);   // (b) 的速度采样用细一档，⛔ 粗采样把滑移摊平
      const run = (tier, dt) => {
        const nn = Math.round(P.LOOP / dt);
        const r = { tier: tier, n: 0, frames: 0, maxPerFrame: 0, dup: 0, aHi: 0, rawHi: 0,
                    fdLo: 1e9, fdHi: 0, ancErr: 0, vrLo: 1e9, vrHi: 0, vN: 0, vT: 0 };
        const prev = {};
        for (let i = 0; i <= nn; i++) {
          catsAt(i * dt, tier);                           // 走真实 render()，⛔ 单调 drawFootWake
          const seen = {}, cur = {};
          for (const x of WAKE_REC) {
            r.n++; cur[x.i + ':' + x.k] = x;
            const e = Math.abs(x.X - (x.fx + x.k * WAKE.side * x.rx));
            if (e > r.ancErr) r.ancErr = e;
            if (x.a > r.aHi) r.aHi = x.a;
            const raw = P.wakeA * x.wk;
            if (raw > r.rawHi) r.rawHi = raw;
            if (x.fd < r.fdLo) r.fdLo = x.fd;
            if (x.fd > r.fdHi) r.fdHi = x.fd;
            if (seen[x.i + ':' + x.k]) r.dup++; else seen[x.i + ':' + x.k] = 1;
          }
          const c = Object.keys(seen).length;
          if (c > r.maxPerFrame) r.maxPerFrame = c;
          if (c) r.frames++;
          for (const kk in prev) {
            const x = cur[kk], p = prev[kk];
            if (!x) continue;
            const df = x.fx - p.fx, uc = x.X - x.k * WAKE.side * x.rx, dU = uc - (p.X - p.k * WAKE.side * p.rx);
            r.vT++;
            if (Math.abs(df) >= 2) {
              const v = dU / df; r.vN++;
              if (v < r.vrLo) r.vrLo = v; if (v > r.vrHi) r.vrHi = v;
            }
          }
          for (const kk in prev) if (!cur[kk]) delete prev[kk];
          for (const kk in cur) prev[kk] = cur[kk];
        }
        return r;
      };
      const why = (r, nn) => {
        const bad = [], frac = r.frames / (nn + 1);
        // 整层没落笔时**只报这一条**：⛔ 让 fdLo/1e9、aHi/0 这些哨兵值冒充"判据越界"刷一屏
        //（那既看不出真因，也会把 wakeA→0 的负样本和真实退化混成同一段文字）。
        if (r.n === 0) return ['a/b/c/d/e/f 全圈 ' + (nn + 1) + ' 帧（档 ' + r.tier + '、强度 '
          + P.wakeA.toFixed(2) + '）没有一处负压落笔 ⇒ 判据无对象'];
        if (!(r.ancErr <= 0.5)) bad.push('a 落笔点离"本只脚 + k·side·rx"最大偏 ' + r.ancErr.toFixed(1)
          + ' px > 0.5 ⇒ 雾脊不再挂在自己那只脚上（回到中心锚定的旧写法，贴近时会横着从两脚之间滑过去）');
        if (r.vN > 0 && !(r.vrLo >= 0.7 && r.vrHi <= 1.3)) bad.push('b 脊锚横向位移/脚横向位移 = '
          + r.vrLo.toFixed(2) + '→' + r.vrHi.toFixed(2) + ' 越出 [0.7, 1.3]（' + r.vN + '/' + r.vT
          + ' 个帧对有横向脚速）⇒ 脊自己在滑，⛔ 跟着脚走');
        if (!(frac <= 0.60)) bad.push('c 全圈 ' + (100 * frac).toFixed(1) + '% 的帧在画负压 > 60% ⇒ 贴身段专属变成了常驻领圈');
        if (!(r.fdHi <= WAKE.d0 + 0.2)) bad.push('c 最远落笔距离 ' + r.fdHi.toFixed(1) + ' m > d0 '
          + WAKE.d0 + ' m ⇒ 包络门被绕过，远处也在排雾');
        if (!(r.fdLo <= WAKE.d1 + 1)) bad.push('c 最近落笔距离 ' + r.fdLo.toFixed(1) + ' m > d1+1 '
          + (WAKE.d1 + 1) + ' m ⇒ 最强的一记没压在掠过那一瞬（d1 与最近位脱钩）');
        if (!(r.aHi >= 0.25 && r.aHi <= 0.32)) bad.push('d 落笔峰值 α ' + r.aHi.toFixed(3)
          + ' 越出 [0.25, 0.32] ⇒ 要么整层读不出来、要么压成一块白饼');
        if (!(r.rawHi > 0.30)) bad.push('d 钳位前的原始值 wakeA·wk 一圈最大只有 ' + r.rawHi.toFixed(3)
          + ' ≤ 0.30 ⇒ WAKE.cap 是死代码，"不越过 cap"没有任何东西在守');
        if (r.dup > 0) bad.push('f 同帧重复落笔 (脚,侧) 组合 ' + r.dup + ' 次 ⇒ 同一道脊画了两遍，画面不变而图元翻倍');
        if (!(r.maxPerFrame <= 9)) bad.push('f 单帧最多 ' + r.maxPerFrame + ' 处落笔 > 9（3 脚 ×(2 脊+1 通道)）⇒ disjoint 图元超预算');
        return bad;
      };
      const loBad = (r) => (r.n > 0 ? ['e LOW 档全圈落笔 ' + r.n + ' 处 > 0 ⇒ 档纪律失效（低端机连第二层雾和暗角都省了，负压更不该例外）'] : []);
      const med = run('MED', DT), high = run('HIGH', DT), low = run('LOW', DT), fast = run('MED', DL);
      const w0 = why(med, N).concat(why(high, N), loBad(low), why(fast, NL));
      const has = (w, tag) => w.some((x) => x.slice(0, tag.length + 1) === tag + ' ');
      const neg = (mut, restore, tag, tier, dt) => {
        mut(); const r = run(tier, dt); restore();
        const w = tier === 'LOW' ? loBad(r) : why(r, Math.round(P.LOOP / dt));
        return { w: w, ok: has(w, tag) };
      };
      const kA = WAKE.anchorK, kB = WAKE.slipK, kC = WAKE.d0, kD = WAKE.cap,
            kE = P.wakeA, kF = WAKE.tierK, kG = WAKE.dupK;
      const nA = neg(() => { WAKE.anchorK = 1; }, () => { WAKE.anchorK = kA; }, 'a', 'MED', DT);
      const nB = neg(() => { WAKE.slipK = 0.5; }, () => { WAKE.slipK = kB; }, 'b', 'MED', DL);
      const nC = neg(() => { WAKE.d0 = 400; }, () => { WAKE.d0 = kC; }, 'c', 'MED', DT);
      const nD = neg(() => { WAKE.cap = 0.90; }, () => { WAKE.cap = kD; }, 'd', 'MED', DT);
      const nE = neg(() => { P.wakeA = 0; }, () => { P.wakeA = kE; }, 'a/b/c/d/e/f', 'MED', DT);
      const nF = neg(() => { WAKE.tierK = 0; }, () => { WAKE.tierK = kF; }, 'e', 'LOW', DT);
      const nG = neg(() => { WAKE.dupK = 2; }, () => { WAKE.dupK = kG; }, 'f', 'MED', DT);
      return { med: med, high: high, low: low, fast: fast, N: N, NL: NL, w0: w0,
               nA: nA, nB: nB, nC: nC, nD: nD, nE: nE, nF: nF, nG: nG };
    });
    const cut = (x) => (x.w.length ? x.w.join('；').slice(0, 220) : '⚠️ 假负样本（判据空转）');
    out.push({ id: 'T31', name: '掠过段负压：逐脚锚定 + 脊速=脚速 + 贴身段专属 + α 钳位真生效 + LOW 0 落笔（R25 裁决=留）',
      pass: R.w0.length === 0 && R.low.n === 0 && R.med.n > 0 && R.high.n > 0
            && R.nA.ok && R.nB.ok && R.nC.ok && R.nD.ok && R.nE.ok && R.nF.ok && R.nG.ok,
      val: 'V0 全圈 ' + (R.N + 1) + ' 帧（1/6 s）：MED 落笔 ' + R.med.n + ' 处 / ' + R.med.frames
         + ' 帧（占 ' + (100 * R.med.frames / (R.N + 1)).toFixed(1) + '%，判 ≤60%）、HIGH '
         + R.high.n + ' 处、⭐ LOW ' + R.low.n + ' 处（档纪律，判 0）；锚定误差 ≤'
         + R.med.ancErr.toFixed(2) + ' px（判 ≤0.5）；细采样 1/12 s 下脊锚/脚横向位移比 '
         + R.fast.vrLo.toFixed(2) + '→' + R.fast.vrHi.toFixed(2) + '（判 ∈[0.7,1.3]，'
         + R.fast.vN + '/' + R.fast.vT + ' 帧对有横向脚速）；落笔最近 '
         + R.med.fdLo.toFixed(1) + ' m（判 ≤' + (WAKE.d1 + 1) + '，即最强一记压在掠过那一瞬）、最远 '
         + R.med.fdHi.toFixed(1) + ' m（判 ≤' + WAKE.d0 + '）；峰值 α ' + R.med.aHi.toFixed(3)
         + '（判 ∈[0.25,0.32]）、钳位前最大原始值 '
         + R.med.rawHi.toFixed(3) + '（判 >0.30 ⇒ cap 不是死代码）；单帧最多 ' + R.med.maxPerFrame
         + ' 处（判 ≤9）、同帧重复 ' + R.med.dup + ' 次',
      neg: '负样本：A 锚→三脚均值（R25 第一版）⇒ ' + cut(R.nA)
         + '；B slipK→0.5（脊朝屏幕中心滑）⇒ ' + cut(R.nB)
         + '；C d0→400 m（整圈常驻）⇒ ' + cut(R.nC)
         + '；D cap→0.90（钳位松开）⇒ ' + cut(R.nD)
         + '；E wakeA→0（整层不落笔）⇒ ' + cut(R.nE)
         + '；F tierK→0（LOW 也画）⇒ ' + cut(R.nF)
         + '；G dupK→2（每只脚画两遍）⇒ ' + cut(R.nG) });
  })();

  // ══ T24 机身呼吸（R24）════════════════════════════════════════════════════
  //    呼吸是**零图元**的细节：只许动轮廓谐波的幅度。三条可判的：
  //      (a) 真的在动且有界：甲壳谐波乘值一圈的峰峰值 ∈ [0.5, 1.3]（≈ 2·breathA 的量级）。
  //      (b) 三段不同相：甲壳 / 顶罩 / 腺囊 乘值最大时刻两两错开 ≥ 1 s（同相 = 整机缩放 = 气球）。
  //      (c) ⛔ 推翻 §3.1 的整机高度口径：真实落笔顶/底缘相对"无呼吸"同一帧的偏移 ≤ 8% 机高。
  //          呼吸一旦进半径，文档里 29%H / 52%H / 115%H 那三个数当场作废、缆须根部还会脱开腹缘。
  //    ⚠️ 接缝闭合不在此列：breathPh 已进 fingerprint，且走 circ() —— ⛔ 塞裸值，
  //       裸值在"周期不整除 90"时照样首尾相等（0.99 圈与 0 圈是两个数），那是 T4 咬不到的假绿。
  //       周期整除性另由 §八（breath 18 s）独立复核。
  //    ⚠️ 「零新增图元」⛔ 写成判据 —— 呼吸不新增任何 ctx 调用，结构上不可能失败，那是恒真式；
  //       一圈的图元计数与 breathA=0 逐一相等，只在 val 里报为观测。
  (() => {
    const DT = 1 / 24, N = Math.round(P.LOOP / DT), cyc = 1 / P.breathHz;
    const scan = () => {
      const sp = PROF, so = OPS, sf = FILL;
      const r = { ts: [], m0: [], m1: [], m2: [], top: [], bot: [], ops: 0, miss: 0 };
      for (let i = 0; i <= N; i++) {
        const st = sceneState(i * DT);
        PROF = {}; OPS = 0; FILL = 0;
        hz = H * P.horizonK + st.tilt;                 // 与 render() 同一处落地，⛔ 各算各的
        BREATH_REC.length = 0;
        drawBody(st, st.yaw);
        r.ops += OPS;
        const b = BREATH_REC[0];
        if (!b) { r.miss++; continue; }                // 机身投影不到相机的帧（pr 返回 null）
        r.ts.push(i * DT); r.m0.push(b.m0); r.m1.push(b.m1); r.m2.push(b.m2);
        r.top.push(b.top); r.bot.push(b.bot);
      }
      PROF = sp; OPS = so; FILL = sf;
      return r;
    };
    // 一个周期内取**第一个**极大时刻：一圈有 5 个峰，全局 argmax 会在 5 个等高峰里任意挑一个，
    // 那读出来的是"哪个峰被采样网格撞上"，不是相位差。
    const firstMax = (ts, arr) => { let k = -1;
      for (let i = 0; i < arr.length && ts[i] < cyc; i++) if (k < 0 || arr[i] > arr[k]) k = i;
      return k < 0 ? NaN : ts[k]; };
    const lag = (a, b) => { const d = Math.abs(a - b) % cyc; return Math.min(d, cyc - d); };
    const stat = (h) => {
      let lo = 1e9, hi = -1e9;
      for (const v of h.m0) { if (v < lo) lo = v; if (v > hi) hi = v; }
      const t0 = firstMax(h.ts, h.m0), t1 = firstMax(h.ts, h.m1), t2 = firstMax(h.ts, h.m2);
      return { p2p: hi - lo, l01: lag(t0, t1), l02: lag(t0, t2), l12: lag(t1, t2) };
    };
    const driftOf = (a, z) => {
      if (a.top.length !== z.top.length) return NaN;   // 帧数不齐 = 两次采样看到的不是同一批帧
      let m = 0, hh = 0;
      for (let i = 0; i < a.top.length; i++) {
        m = Math.max(m, Math.abs(a.top[i] - z.top[i]), Math.abs(a.bot[i] - z.bot[i]));
        hh = Math.max(hh, z.bot[i] - z.top[i]);        // 分母取**无呼吸**时的机高（口径基准）
      }
      return m / hh;
    };
    const why = (s, dr) => {
      const bad = [];
      if (!(s.p2p >= 0.5 && s.p2p <= 1.3)) bad.push('a 甲壳谐波乘值峰峰值 ' + s.p2p.toFixed(3)
        + ' 越出 [0.5, 1.3] ⇒ ' + (s.p2p < 0.5 ? '基本没在动，这条细节等于没做' : '整机在明显胀缩（气球）'));
      const lmin = Math.min(s.l01, s.l02, s.l12);
      if (!(lmin >= 1)) bad.push('b 三段最大时刻最近的一对只差 ' + lmin.toFixed(2)
        + ' s（< 1 s）⇒ 同相缩放，读成气球而不是皮下蠕动');
      if (!(dr <= 0.08)) bad.push('c 真实落笔顶/底缘相对无呼吸时最大偏移 ' + (dr * 100).toFixed(1)
        + '% 机高（> 8%，或帧数不齐读不出）⇒ §3.1 的整机高度口径被呼吸推翻');
      return bad;
    };
    const kA = P.breathA, kP = BREATH.ph.slice(), kR = BREATH.radK;
    const h0 = scan();
    P.breathA = 0; const z0 = scan(); P.breathA = kA;      // z0 同时是 A 的负样本与 (c) 的基准
    const d0 = driftOf(h0, z0), s0 = stat(h0), w0 = why(s0, d0);
    const wa = why(stat(z0), d0);
    P.breathA = 1.2; const wB = why(stat(scan()), d0); P.breathA = kA;
    BREATH.ph = [0, 0, 0]; const wb = why(stat(scan()), d0); BREATH.ph = kP;
    BREATH.radK = 1; const hc = scan(); BREATH.radK = kR;
    const wc = why(s0, driftOf(hc, z0));
    out.push({ id: 'T24', name: '机身呼吸：只在动且有界、三段错相、⛔ 推翻整机高度口径（R24）',
      pass: w0.length === 0 && h0.m0.length > 0 && wa.length > 0 && wb.length > 0 && wc.length > 0
            && wB.length > 0,
      val: '一圈 ' + (N + 1) + ' 帧（1/24 s），机身在画 ' + h0.m0.length + ' 帧（投影不到 '
         + h0.miss + ' 帧）：甲壳谐波乘值峰峰值 ' + s0.p2p.toFixed(3) + ' ∈ [0.5, 1.3]（breathA '
         + P.breathA.toFixed(2) + '、周期 ' + cyc.toFixed(0) + ' s ⇒ 一圈 ' + (P.LOOP / cyc).toFixed(0)
         + ' 次呼吸）；三段最大时刻两两错开 ' + s0.l01.toFixed(2) + ' / ' + s0.l02.toFixed(2) + ' / '
         + s0.l12.toFixed(2) + ' s（判 ≥1 s）；真实落笔顶/底缘相对无呼吸时最大偏移 '
         + (d0 * 100).toFixed(2) + '% 机高（判 ≤8%）；零新增图元（观测）：一圈图元计数 ' + h0.ops
         + ' vs 无呼吸 ' + z0.ops + '；breathPh 已进 T4 指纹（' + fingerprint(sceneState(0)).length + ' 字段）',
      neg: '负样本：A 深度→0（没在动）⇒ ' + (wa.join('；') || '⚠️ 假负样本')
         + '；B 深度→1.2（胀缩成气球）⇒ ' + (wB.join('；') || '⚠️ 假负样本')
         + '；C 三相归零（同相缩放）⇒ ' + (wb.join('；') || '⚠️ 假负样本')
         + '；D 呼吸进半径（radK→1，推翻 §3.1 口径）⇒ ' + (wc.join('；') || '⚠️ 假负样本') });
  })();

  // ══ T25 落地顶机闸门（R26）═══════════════════════════════════════════════════
  //    相机回弹必须是**落地事件的导出量**，而且只在机器真的靠近时存在：
  //      (a) 一记不漏、一记不多 —— 包络内（joltK ≥ 0.25）的落地上升沿数 == joltY 的正峰数
  //          （峰地板取**当帧包络的 0.15 倍**，与事件同一个边界；见 scanJolt 里那两条实测）
  //      (b) 远处不晃 / 近处吃满 —— dist ≥ 150 m 的帧恒为 0；dist ≤ dIn 的帧峰值 ≥ 0.6·joltA
  //          （两区都按**物理距离**判，⛔ 按包络判：包络自己定义"远处"，拆掉包络就没有远处）
  //      (c) 不叠爆 —— max|joltY| ≤ joltA（IMPACT.win < 1/3 ⇒ 同帧最多一条腿在窗内，这条就是它的对账）
  //      (d) 接缝不残留 —— joltY 在 t=0 与 t=LOOP 都恰为 0
  //    ⚠️ 全部读 sceneState **导出的那一份**（st.legs[].imp / st.joltY / st.joltK），
  //       ⛔ 在闸门里重算一条距离包络、或重推一遍 imp 窗（两套口径）。
  //    观测（⛔ 当判据）：与恒幅微抖的相关系数 —— 它证明这一层不是把 shakeY 又画了一遍。
  (() => {
    const JDT = 1 / 48, JN = Math.round(P.LOOP / JDT);
    // "远处"的**物理**判据（m），⛔ 跟着 JOLT.dOut 走 —— 见 scanJolt 里那条注释。
    // 150 m 时整机对比度已不到 6%（T3 的接缝位 220 m 是 4.08%），那一记落地观众根本看不见。
    const FAR_D = 150;
    const scanJolt = () => {
      const r = { ev: 0, pk: 0, hi: 0, nearHi: 0, farHi: 0, seam: 0, rho: 0 };
      const jy = [], ms = [], kk = [], prev = [0, 0, 0];
      for (let i = 0; i <= JN; i++) {
        const st = sceneState(i * JDT), a = Math.abs(st.joltY);
        jy.push(st.joltY); ms.push(st.shakeY - st.joltY); kk.push(st.joltK);
        if (a > r.hi) r.hi = a;
        // ⚠️ 远近两区按**物理距离**判，⛔ 按包络自己判：拿 joltK≈0 定义"远处"，
        //    把 dOut 拆到 1e9 后就没有任何帧算"远处"了 —— 负样本 C 第一版就是这么变成假负样本的。
        if (st.dist <= JOLT.dIn && a > r.nearHi) r.nearHi = a;
        if (st.dist >= FAR_D && a > r.farHi) r.farHi = a;
        for (let j = 0; j < 3; j++) {
          const on = st.legs[j].imp > 1e-9 ? 1 : 0;
          if (on && !prev[j] && st.joltK >= 0.25) r.ev++;      // 上升沿 = 一记落地
          prev[j] = on;
        }
      }
      // ⚠️ 峰检测必须**第二遍**做：采样循环里 jy[i+1] 还不存在，`jy[i] > undefined` 恒 false
      //    ⇒ 峰数永远是 0（第一版就是这么红的）。
      //    地板取**当帧包络的 0.15 倍**，⛔ 绝对像素、⛔ 无地板：
      //      · 绝对地板与"事件按 joltK ≥ 0.25 计"是两条边界，边界上的事件会系统性数多/数漏
      //        （第一版 pk 73 vs ev 68 就是这么来的）；
      //      · 无地板则数到**窗尾的小回波** —— cos 在 w→1 处回到 +1，而 imp 只剩 (1-w)^1.5 ≈ 0.03，
      //        一记落地被数成两峰（第二版 pk 137 = 2×68 就是这么来的）。
      //    实测三个量级：主峰 0.89·env、cyc=2 的第二主峰 0.30·env、窗尾回波 0.03·env ⇒ 0.15 两边都有 2× 余量。
      for (let i = 1; i < JN; i++) {
        if (kk[i] < 0.25) continue;
        if (jy[i] >= 0.15 * P.joltA * kk[i] && jy[i] >= jy[i - 1] && jy[i] > jy[i + 1]) r.pk++;
      }
      r.seam = Math.abs(sceneState(0).joltY) + Math.abs(sceneState(P.LOOP).joltY);
      let m1 = 0, m2 = 0;
      for (const v of jy) m1 += v; for (const v of ms) m2 += v;
      m1 /= jy.length; m2 /= ms.length;
      let c = 0, v1 = 0, v2 = 0;
      for (let i = 0; i < jy.length; i++) { c += (jy[i] - m1) * (ms[i] - m2); v1 += (jy[i] - m1) ** 2; v2 += (ms[i] - m2) ** 2; }
      r.rho = v1 > 0 && v2 > 0 ? c / Math.sqrt(v1 * v2) : 0;
      return r;
    };
    const why = (x) => {
      const bad = [];
      if (x.hi < 1e-9) bad.push('一圈 ' + (JN + 1) + ' 帧里相机**一次都没被顶过**（joltA '
        + P.joltA.toFixed(1) + '）⇒ 本闸门无对象');
      if (Math.abs(x.pk - x.ev) > 1) bad.push('joltY 正峰 ' + x.pk + ' 个 vs 包络内落地 '
        + x.ev + ' 记 ⇒ 回弹不是落地的导出量（漏腿，或自己带了一条频率）');
      if (x.farHi > 1e-9) bad.push('远处（dist ≥ ' + FAR_D + ' m，包络本该为零）的帧里最大 |joltY| = '
        + x.farHi.toFixed(3) + ' px ≠ 0 ⇒ 机器还在雾那头镜头就先晃，穿帮');
      if (!(x.nearHi >= 0.6 * P.joltA)) bad.push('贴身段（dist ≤ ' + JOLT.dIn + ' m）峰值只有 '
        + x.nearHi.toFixed(2) + ' px < 0.6·joltA = ' + (0.6 * P.joltA).toFixed(1)
        + ' ⇒ 最该有重量感的那几秒被包络掐掉了');
      if (x.hi > P.joltA + 1e-9) bad.push('max|joltY| = ' + x.hi.toFixed(2) + ' px 超过 joltA '
        + P.joltA.toFixed(1) + ' ⇒ 多条腿的冲击叠在了一起（IMPACT.win 必须 < 1/3）');
      if (x.seam > 1e-9) bad.push('接缝两侧 |joltY| 合计 ' + x.seam.toExponential(1)
        + ' ≠ 0 ⇒ 跨圈残留，换圈那一瞬凭空多出一记');
      return bad;
    };
    const x0 = scanJolt(), w0 = why(x0);
    const k1 = JOLT.legK, k2 = JOLT.cyc, k3 = JOLT.dOut, k4 = P.joltA, k5 = IMPACT.win;
    JOLT.legK = 1;      const wa = why(scanJolt());  JOLT.legK = k1;
    JOLT.cyc = 2;       const wb = why(scanJolt());  JOLT.cyc = k2;
    JOLT.dOut = 1e9;    const wc = why(scanJolt());  JOLT.dOut = k3;
    P.joltA = 0;        const wd = why(scanJolt());  P.joltA = k4;
    IMPACT.win = 0.9;   const we = why(scanJolt());  IMPACT.win = k5;
    out.push({ id: 'T25', name: '落地顶机：峰数同落地数、远处为零近处吃满、不叠爆、接缝不残留（R26）',
      pass: w0.length === 0 && x0.pk > 0 && wa.length > 0 && wb.length > 0 && wc.length > 0
            && wd.length > 0 && we.length > 0,
      val: '一圈 ' + (JN + 1) + ' 帧（1/' + Math.round(1 / JDT) + ' s）：包络内（joltK ≥ 0.25）落地 '
         + x0.ev + ' 记 ⇒ joltY 正峰 '
         + x0.pk + ' 个（判相等，容差 1）；峰值 ' + x0.hi.toFixed(2) + ' px ≤ joltA '
         + P.joltA.toFixed(1) + '，贴身段（dist ≤ ' + JOLT.dIn + ' m）' + x0.nearHi.toFixed(2)
         + ' px、远处（dist ≥ ' + FAR_D + ' m）' + x0.farHi.toFixed(4)
         + ' px；接缝两侧合计 ' + x0.seam.toExponential(1) + '；与恒幅微抖的相关系数 '
         + x0.rho.toFixed(3) + '（观测值，⛔ 当判据 —— 它只证明这一层不是把 shakeY 重画一遍）；'
         + '横向串扰 xK ' + JOLT.xK.toFixed(2) + '；joltY 折进 shakeY 后仍由 T4 指纹闭合（'
         + fingerprint(sceneState(0)).length + ' 字段，未新增）',
      neg: '负样本：A 只挂一条腿（legK→1）⇒ ' + (wa.join('；') || '⚠️ 假负样本')
         + '；B 一记里两个回弹（cyc→2）⇒ ' + (wb.join('；') || '⚠️ 假负样本')
         + '；C 距离包络拆掉（dOut→1e9）⇒ ' + (wc.join('；') || '⚠️ 假负样本')
         + '；D 幅度→0 ⇒ ' + (wd.join('；') || '⚠️ 假负样本')
         + '；E 冲击窗放宽到 0.9 步幅（三腿叠加）⇒ ' + (we.join('；') || '⚠️ 假负样本') });
  })();
  // T26 滑杆初值的**单一事实源**（R28 踩坑：把 P.headFwd 从 7 改成 3.4，25 条闸门全绿、
  //     截图纹丝不动 —— markup 的 `value="7"` 在 initUI 第一次 sync() 里把 P 表按回了 7）。
  //     两条判据各抓一种"沙箱与真机两个默认值"：
  //       a 每个滑杆的 P 默认值落在 [min,max] 内 —— 浏览器会夹断、stub 里的 el 是普通对象不会；
  //       b 且落在 step 的格点上 —— 浏览器会吸附到最近格点、stub 同样不会。
  //     ⚠️ 这条闸门在**修复前**跑必红（b 类历史遗留一堆非格点默认值），那不是把闸门写坏了，
  //     是它抓到了真东西：那些数在电视/浏览器里从来就不是页面上写的那个数。
  (function () {
    const bad = checkSliders();
    const list = bad.map(o => o.key + '=' + o.v + '（' + o.why + '）').join('、');

    for (const k in s) lg.innerHTML += '<div class="ok">' + k.padEnd(6) + String(s[k].ops).padStart(6) + '  ' + s[k].fill.toFixed(2) + ' 屏</div>';

function setPlay(v) { playing = v; document.getElementById('bPlay').textContent = v ? '⏸ 暂停' : '▶ 播放'; }
function hud(st) {
  const ph = PHASES.findIndex(p => st.t >= p[1] && st.t < p[2]);
  // ⭐ R29：HUD 第一行带上**当前剧本**与圈数 —— 判读截图时"这是哪一出戏"必须写在画面上，
  //    ⛔ 靠文件名里的秒数反推（三种剧本在同一秒演的是完全不同的事）。
  return VARS[CURVAR].name + '  纪元 ' + routeEpoch + '  lap ' + lapN + '\n'
       + 't ' + st.t.toFixed(2) + 's  ' + (ph >= 0 ? PHASES[ph][0] : '—') + '\n'
       + 'd  ' + st.d.toFixed(1) + ' m（真 ' + st.dist.toFixed(1) + '）侧移 ' + st.mx.toFixed(1)
       + ' 航向 ' + (st.psi * 180 / Math.PI).toFixed(0) + '°\n'
       + '   fog ' + fogOf(st.dist, st.D0).toFixed(3) + '  对比度 ' + (contrastAt(st.dist, st.D0) * 100).toFixed(1) + '%\n'
       + 'v_walk  ' + st.vWalk.toFixed(2) + ' m/s   camSpeed ' + st.camSpeed.toFixed(2) + ' m/s\n'
       + 'C       ' + st.C.toFixed(1) + ' m   stepPhase ' + st.s.toFixed(3) + '  (G ' + st.G.toFixed(0) + '/' + gTotal() + ' m)\n'
       + 'yaw     ' + (st.yaw * 180 / Math.PI).toFixed(1) + '°   建筑 ' + st.bld.length + ' 栋\n'
       + 'ops     ' + OPS + '    fill ' + FILL.toFixed(2) + ' 屏    tier ' + P.tier;
}
function frame(ts) {
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (playing) {
    const nt = tNow + dt * tScale;
    if (nt >= P.LOOP) lapN++;                 // R16：圈数计数，⛔ mod 会把换路时机抹掉
    tNow = mod(nt, P.LOOP);
    syncRouteEpoch(false);                    // ⛔ 在 sceneState 之前：换路必须落在接缝帧
  }
  document.getElementById('sT').value = tNow;
  document.getElementById('oT').textContent = tNow.toFixed(1);
  const st = sceneState(tNow);
  render(st);
  document.getElementById('hud').textContent = hud(st);
  const bs = document.querySelectorAll('#ph b');
  for (let i = 0; i < bs.length; i++) bs[i].classList.toggle('on', st.t >= PHASES[i][1] && st.t < PHASES[i][2]);
  requestAnimationFrame(frame);
}
